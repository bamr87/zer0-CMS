# =============================================================================
# verify/verify.yml — how to run zer0-CMS the way a USER would
# =============================================================================
# kit: verify v0.1.0 (seeded from bamr87/bamr87 templates/verify/)
#
# Read by three consumers, so it is the one place "how do I start this thing and
# where do I look" is written down:
#   1. verify/runner.mjs            — executes verify/scenarios/*.yml with Playwright
#   2. fleet-verify.yml (reusable)  — starts the app in CI, runs the runner, and
#                                     (on `verify`-labelled PRs) hands the live
#                                     app to a Claude Code pass via the Playwright MCP
#   3. .claude/skills/verify-feature — the agent skill that drives it locally
#
# The app under verification is the platform (content/, ADR 0004): the studio
# it serves at /studio/ (built from web/ first), the Wagtail admin and the
# APIs. It runs on SQLite with the recorded model backend, seeded with the demo
# site (`manage.py seed_demo`: the person `editor`, password `zer0-demo` under
# DEBUG, and pending suggestions on every start), so a scenario never needs
# Postgres, Redis or a provider key. The VS Code extension is verified by its
# own suite (`npm test`), not through a browser.
# =============================================================================
schema: verify/v1

app:
  # Command that serves the app (run from the repo root, in the background).
  start: "cd content && python manage.py migrate --noinput -v0 && python manage.py seed_demo && python manage.py runserver 127.0.0.1:8000 --noreload"
  # Optional one-shot build before `start` / before serving `static_dir`: the studio.
  build: "cd web && npm ci && npm run build"
  # Directory to serve statically when `start` is empty (e.g. _site, dist, build).
  static_dir: ""
  # Base URL the scenarios navigate against.
  url: http://127.0.0.1:8000
  # Path polled until it answers 200 before any scenario runs (liveness: no dependency).
  ready: /healthz
  # Seconds to wait for `ready`.
  timeout_s: 180
  # Install step (the platform's requirements, including the test and lint tools).
  install: "pip install -r content/requirements-dev.txt"

# Named viewports scenarios can reference by name.
viewports:
  desktop: { width: 1280, height: 800 }
  tablet: { width: 768, height: 1024 }
  mobile: { width: 390, height: 844 }

# Where things live (relative to the repo root).
features: features/features.yml
scenarios: verify/scenarios
evidence_dir: test/evidence

# The agent pass (fleet-verify.yml with `agent: true`, or the verify-feature skill).
agent:
  # Routes the agent should start from when exploring beyond the scenarios.
  entry_routes: ["/studio/", "/admin/login/", "/api/v2/docs/", "/healthz"]
  # Things the agent must never do against this app (it reads this list).
  never:
    - "submit forms that send email or create real records against a shared backend"
    - "sign in with real credentials"
    - "publish a page, accept a suggestion or start an agent run against a site that is not a fixture"
