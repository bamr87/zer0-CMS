      - {id: rails.distribution-queue, what: "The LinkedIn queue — approve, publish, statistics.", target: distribution.queue, status: done, proof: web/packages/ui/test/distribution.test.tsx, note: "G5: the studio's Distribution → Queue (the guard, the exact payload, approve, publish with every blocker, force, record) and Statistics; API: content/tests/distribution/test_platform.py::test_publish_checks_every_gate_in_the_request_and_again_on_the_worker. /admin/distribution is deleted."}
