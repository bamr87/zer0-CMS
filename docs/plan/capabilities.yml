      - {id: rails.front-matter, what: "Parse front matter and update keys by line surgery, keeping comments, quoting, BOM and line endings.", target: sites.sync, status: done, proof: "content/tests/sites/test_frontmatter.py::test_surgery_table", note: "G4: content/sites/frontmatter.py, every Ruby test ported. The Ruby one stays while the Rails app and the LinkedIn lane run on it"}
      - {id: rails.writer, what: "Confined create and duplicate with slugify and transliteration.", target: sites.sync, status: specified, decided_by: "the owner, 2026-10-27: delete the Rails CMS and keep only the specs of what the platform still has to build (ADR 0008)", spec: docs/plan/rails-cms-spec.md#railswriter, note: "G4: content/sites/writer.py — confinement, O_EXCL create, the atomic replace and the transliterating slugs (content/tests/sites/test_writer.py); a page made in the platform gets its file from the write-back. Open: duplicating a page as a draft (content.create)"}
      - {id: rails.doctor, what: "zer0-cms doctor PATH — theme, image-engine, CMS, fleet and content checks as findings.jsonl (and the reusable zer0-doctor.yml content repositories call).", target: sites.doctor, status: done, proof: "content/tests/sites/test_doctor.py::test_each_scenario_matches_the_ruby_doctor", note: "G4: content/sites/doctor.py, held to the Ruby doctor's recorded findings; zer0-doctor.yml runs it. Dropped by ADR 0006 decision 4 (the owner's): the theme check's theme-not-zer0 and no-theme-overrides, and the theme's front-matter schema, replaced by the site's own zer0.json content types. The Ruby doctor is deleted"}
