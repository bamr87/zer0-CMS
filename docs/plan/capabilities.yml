    what: The ABC book wizard — themes, lexicons, art styles, letters, export into a site.
    surfaces: {api: missing, studio: missing}

  # ── Platform and operations ─────────────────────────────────────────────────
  - id: platform.accounts
    what: Email sign-up with verification, login by code, password reset, OIDC SSO, GitHub login, MFA (TOTP, passkeys, recovery codes), the session list.
    # P4: sign-in with a username and password over a session with CSRF (api/session.py, studio/src/auth.tsx); everything else is G3's allauth.
    surfaces: {api: partial, studio: partial, extension: missing}
  - id: platform.tokens
    what: Personal API tokens and agent tokens, issued and revoked.
    surfaces: {api: partial, studio: missing, extension: missing}
  - id: platform.permissions
    what: Roles, groups, per-site permissions, and per-person ownership and sharing.
    surfaces: {api: partial, studio: missing}
  - id: platform.audit
    what: An audit log of who did what, people and agents alike.
    surfaces: {api: missing, studio: missing}
  - id: platform.events
    what: Outbox events with versioned schemas, and webhooks.
    surfaces: {api: partial, ops: partial}
  - id: platform.api
    what: REST, GraphQL and MCP over one tool registry, committed schemas, and the client generated from them.
    surfaces: {api: partial, mcp: partial, ops: partial}
  - id: platform.notifications
    what: Email (with a provider such as SES) and in-app notifications.
