# The capability ledger (ADR 0006). Read by tools/check_absorption.py, which
# CI runs on every pull request (zer0-workspace.yml).
#
# Four parts:
#
#   theme_ratchet / theme_allowed — the zer0-mistakes burn-down: code and config
#     that names the theme, per prefix, until only the Jekyll-theme option does.
#
#   ruby_ratchet / ruby_fixtures — the Ruby burn-down. Each prefix may hold at
#     most its ceiling of Ruby files; Ruby anywhere else fails. Ceilings only go
#     down: `python3 tools/check_absorption.py --tighten` after removing Ruby.
#     Fixtures are files that only model an outside Jekyll site for a test.
#
#   platform — the target: every capability the one platform must have, and its
#     status on each surface that must offer it (api, studio, extension, mcp,
#     site, ops). A surface is `done` only with a `proof:` path (a test) that
#     exists. TARGET.md describes the same catalog in prose.
#
#   sources — every repository merged into zer0-CMS, every capability it had,
#     and the platform capability it lands in (`target:`, a platform id). A row
#     is `missing`, `partial`, `done` (with `proof:`) or `dropped` (with
#     `decided_by:` naming the owner's decision — an agent never drops a row).
#     A source's directory may be deleted only when no row is missing/partial.
#
# Statuses here were set on 2026-10-21 from two code inventories, conservatively:
# nothing is `done` without a test that proves it, and `partial` means the
# platform has a piece of it, not that it is close. The milestone that absorbs a
# source completes that source's rows from the code in its first commit.
schema: capabilities/v1

ruby_ratchet:
  apps/parodynews/src/pages/: 2
  packages/zer0-image-generator/: 223
  rails/: 151
  sites/2005/: 1
  sites/drsai/: 1
  sites/wargames/: 1
  sites/zer0-demo-cookbook/: 1
  sites/zer0-demo-garden/: 1
  sites/zer0-pages-remote/: 1
  sites/zer0-pages/: 11

theme_ratchet:
  # zer0-mistakes leaves completely (ADR 0006 decision 4): code and configuration
  # that names the theme, per prefix. Content that talks about it is not counted.
  .github/: 5
  .vscode/: 1
  apps/parodynews/: 5
  content/: 1
  media/: 1
  packages/zer0-image-generator/: 8
  rails/lib/: 5
  rails/schema/: 1
  rails/test/: 2
  schemas/: 1
  sites/2005/: 2
  sites/drsai/: 5
  sites/irony-works/: 5
  sites/wargames/: 5
  sites/zer0-demo-cookbook/: 4
  sites/zer0-demo-garden/: 4
  sites/zer0-pages-remote/: 2
  sites/zer0-pages/: 4
  src/core/: 13
  src/test/: 6
  src/webview/: 1
  workspace.yml: 1

theme_allowed:
  # The only files that may name the theme for good: the Jekyll-theme option's
  # own (PLAN P2: the option, its tests and its jekyll-4 server's image) and this gate.
  - tools/jekyll_theme.py
  - tools/tests/test_jekyll_theme.py
  - tools/jekyll/Dockerfile
  - tools/check_absorption.py
  - tools/tests/test_check_absorption.py

ruby_fixtures:
  # The extension detects a Jekyll site by its Gemfile (src/core/platform/detect.ts);
  # this two-line file is that evidence in src/test/platform.test.ts.
  - src/test/fixtures/sites/jekyll-zer0-mistakes/Gemfile

platform:
  # ── Content model and authoring ─────────────────────────────────────────────
  - id: content.types
    what: Page types, fields and StreamField blocks, per-type default field values, and the exported agent block schema.
    # P4: every type and the creatable ones under a parent (api), each type's editable fields as specs the studio renders.
    surfaces: {api: partial, studio: partial, mcp: partial}
  - id: content.list
    what: Browse and filter pages across sites — tree, lists, and a filter language (status, collection, site, kind, tag, category, author, errors).
    # P4: any status across sites, filtered by site, parent (the tree), type, status and text; tag/category/author/errors filters to come.
    surfaces: {api: partial, studio: partial, extension: partial, mcp: partial}
  - id: content.create
    what: Create a page or a draft from a type in a site and section, or duplicate one as a draft.
    # P4: create as a draft from a type the parent allows; duplicate to come.
    surfaces: {api: partial, studio: partial, extension: partial, mcp: partial}
  - id: content.edit
    what: A block editor with a Markdown round trip, front matter and fields, autosave, and a stale-write guard.
    # P4: blocks (TipTap with the Markdown round trip; rich text keeps its internal links), typed fields, save as a draft with a required stale-write guard (409) under the page row's lock; autosave and raw front matter to come.
    surfaces: {api: partial, studio: partial, extension: partial, mcp: partial}
  - id: content.seo
    what: SEO and social fields (title, description, keywords, canonical, Open Graph, noindex) with insights and agent proposals for a page.
    # P4: title tag, description (with lengths shown), keywords, summary; canonical, Open Graph and noindex to come.
    surfaces: {api: partial, studio: partial, extension: partial, mcp: partial}
  - id: content.preview
    what: Live preview of a draft in the site's own design, including the exact exported document and file name.
    # P4: the latest revision rendered by the platform (preview_url); the site's own design and the exported document to come.
    surfaces: {api: partial, studio: partial, extension: partial}
  - id: content.revisions
    what: Revisions with diff, compare and revert.
    surfaces: {api: done, studio: done, extension: missing, mcp: missing}
    proof:
      api: content/tests/api/test_pages.py::test_revisions_compare_and_revert_as_a_new_draft
      studio: web/packages/ui/test/editor.test.tsx
  - id: content.workflow
    what: Editorial workflows with moderation states, tasks and assignments, and the governed publish path (draft → brand guard → approval → publish).
    surfaces: {api: missing, studio: missing, extension: partial}
  - id: content.publish
    what: Publish and unpublish now or on a schedule.
    # P4: publish now, unpublish now, a go-live time and an expiry (each carried out by beat, one page per transaction); the studio's editor offers all four.
    surfaces: {api: done, studio: done, extension: partial, mcp: partial}
    proof:
      api: content/tests/api/test_pages.py::test_publish_and_unpublish_now_or_on_a_schedule
      studio: web/packages/ui/test/editor.test.tsx
  - id: content.collaboration
    what: Comments, mentions and page locking.
    # P4: Wagtail's locks hold in every writer (409 resource.locked) and the editor shows a locked page read-only, saying why; locking and unlocking, comments and mentions to come.
    surfaces: {api: partial, studio: partial, extension: missing}
  - id: content.localization
    what: Locales, per-locale trees and a translation workflow.
    surfaces: {api: missing, studio: missing, site: missing}
  - id: content.taxonomy
    what: Tags, categories, series, authors and entities, managed and assigned.
    # P4: tags, categories and authors assigned in the editor; managing them to come.
    surfaces: {api: partial, studio: partial, extension: partial}
  - id: content.search
    what: Full-text search with filters, semantic search, and search promotions.
    surfaces: {api: partial, studio: missing, extension: partial, mcp: partial, site: missing}
  - id: content.redirects
    what: A redirect manager, and redirects from every imported page's legacy path.
    surfaces: {api: missing, studio: missing, site: missing}
  - id: content.forms
    what: A form builder and its submissions.
    surfaces: {api: missing, studio: missing, site: missing}
  - id: content.navigation
    what: Menus, footers (including powered-by links) and reusable snippets per site.
    surfaces: {api: missing, studio: missing, site: missing}
  - id: content.bulk
    what: Bulk actions, and import/export of content and configuration as CSV, JSON or YAML.
    surfaces: {api: missing, studio: missing, ops: missing}
  - id: content.import
    what: Importers (Jekyll and Obsidian sites, parodynews, books, WordPress) that are idempotent and round-trip byte for byte.
    surfaces: {ops: partial}
  - id: content.export
    what: Every site and book also exists as a generated file tree (a site's source, a book's library/<slug>/) — exported byte-stably, committed by a job, re-importable; a hand edit to it comes back as a suggestion.
    surfaces: {api: missing, studio: missing, ops: partial}
  - id: content.repurpose
    what: Turn one piece into others — an article into a newsletter item, a social thread, a summary, a landing page.
    surfaces: {api: missing, studio: missing, extension: missing, mcp: missing}

