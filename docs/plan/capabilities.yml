    # G9: BookPage/ChapterPage hold the library format; /api/v2/books/ and the studio's Books area (shelf, overview,
    # chapters, a book's other files, findings, manuscript). Partial for parts: ADR 0006 decision 14 names parts
    # between a book and its chapters, and today a book's parts are its acts (book.yml `acts`, a chapter's `act`, the
    # manuscript's act headings) — open decision P-D8. The extension is G10; no MCP tool reads books yet.
    surfaces: {api: partial, studio: partial, extension: missing, mcp: missing}
