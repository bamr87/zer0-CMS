  - id: books.create
    what: Create a book with AI — premise → outline → chapter plan.
    # G9: a premise is an ai.Brief the bundled outliner generates; the person accepts it and the book is made as a
    # draft with a stub per planned chapter (studio: BookShelf's "From a premise").
    surfaces: {api: done, studio: done, extension: missing}
