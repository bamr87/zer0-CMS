  - id: ai.conversations
    what: Conversations — threads and messages replayed to any provider, run an assistant or a pipeline, assign, re-run, promote a message to a brief or a draft.
    # G8 screens: AI → Conversations (and Create) — send and follow the reply's run, filter, ask again (or another assistant), run the pipeline, promote to a brief or a draft, delete; the newest messages first, earlier ones loaded on request; verify/scenarios/studio-ai-chat.yml in a browser.
    surfaces: {api: done, studio: done, extension: missing}
    proof:
      api: content/tests/ai/test_api.py::test_a_conversation_takes_messages_lists_them_by_cursor_and_promotes_one
      studio: web/packages/ui/test/ai/conversations.test.tsx
  - id: ai.agents
    what: Tool-using agents — GitOps definitions, policies, runs with step timelines and cancel, agent tokens.
    # P4: runs and a run's live step timeline in the studio; definitions, cancel and tokens to come.
    surfaces: {api: partial, studio: partial, extension: partial, mcp: partial}
  - id: ai.suggestions
    what: Suggestions with diffs — accept, reject with a reason, accept all of a run.
    # P4: one scope (Suggestion.objects.visible_to) on every surface; accepting all of a run accepts the ones the person was shown.
    surfaces: {api: done, studio: done, extension: partial, mcp: partial}
    proof:
      api: content/tests/api/test_review.py
      studio: web/packages/ui/test/review.test.tsx
  - id: ai.evals
    what: Eval suites over recorded fixtures that gate an agent's policy.
    surfaces: {ops: partial}
  - id: ai.usage
    what: Tokens, cost and budgets per run, person, site and provider.
    # P4: a run's tokens and cost on its timeline. G8: each reply's provider, model, tokens and cost in its conversation; a provider's monthly budget set in the studio. Rollups per person and site, and their budgets, to come (H2).
    surfaces: {api: partial, studio: partial}
  - id: ai.streaming
    what: A run's event stream to the client, asynchronous runs, and idempotent run creation.
    # P4: /api/v2/agent-runs/<id>/stream/ answers a browser's EventSource on gthread workers (it outlives gunicorn's worker timeout), and the studio's timeline follows it live — stopping at a final status, reopening after a pause, backing off from a broken stream. G8: every screen that starts a run (202) follows it the same way (useLiveRun) and reads its result when it ends, and every request that starts a run carries an Idempotency-Key made when the person acts (the API replays the first answer to a repeat); its control waits while the request is out and a double click asks once — conversations.test.tsx (keys, Ctrl+Enter sends once, a message's actions held), providers.test.tsx (one check per double click), briefs.test.tsx and aipanel.test.tsx.
    surfaces: {api: done, studio: done, extension: missing}
    proof:
      api: content/tests/ai/test_api.py::test_running_a_visible_assistant_is_a_202_with_the_run_and_a_key_replays_it
      studio: web/packages/ui/test/ai/conversations.test.tsx

  # ── Sites: manage, monitor, improve ─────────────────────────────────────────
  - id: sites.registry
    what: Register and discover sites; per-site settings, domains, design and skin, budgets.
    # P4: the sites a person can work in, listed (api) and switched between (studio). G4: content/sites — ManagedSite
    # (checkout, content source, renderer, domains, deploy target, digests, findings) and SiteSettings (SEO defaults,
    # analytics ids, navigation, brand voice, skin and tokens, budget); /api/v2/sites/ registers a checkout (workspace.yml's
    # or SITES_DIR's), discovers, edits; the studio's Sites area does all of it. The extension's half is G10.
    surfaces: {api: done, studio: done, extension: partial}
    proof:
      api: content/tests/sites/test_sites.py
      studio: web/packages/ui/test/sites.test.tsx
  - id: sites.sync
    what: Sync a site's files with the platform — the exact Jekyll reader, line-level front-matter surgery, the confined writer, write-back with a stale-write guard.
    # G4: sites/catalog.py (Jekyll 4.4's reader, byte for byte against Jekyll's own lists; the importer reads through it),
    # sites/frontmatter.py (line surgery; the exporter renders a changed page over its file with it), sites/writer.py;
    # sync and write-back as jobs (/api/v2/sites/<id>/sync/ and export/, manage.py site_job) under the Rails PageEditor's
    # stale-write guard. The extension's file mode keeps its own until G10.
    surfaces: {api: done, extension: partial, ops: done}
    proof:
      api: content/tests/sites/test_sites.py::test_a_file_changed_by_hand_since_the_last_sync_is_never_overwritten
      ops: content/tests/sites/test_catalog.py::test_the_fixture_sites_match_jekylls_reader_byte_for_byte
  - id: sites.jobs
    what: Background jobs (sync, render, deploy, preview, doctor, reports) with live logs, artifacts and cancel.
    # G4: content/jobs — Job, its log lines (streamed as server-sent events) and artifacts, cancel, one exclusive job per
    # site; sync, write-back and doctor are its first kinds (render, deploy, preview and reports come with their milestones).
    surfaces: {api: done, studio: done}
    proof:
      api: content/tests/jobs/test_jobs.py
      studio: web/packages/ui/test/sites.test.tsx
  - id: sites.render
    what: The React site renderer, in the platform's own design system — layouts, skins, feeds, sitemap, robots, search index, redirects — reproducing each site's recorded build.
    surfaces: {site: missing, ops: missing}
  - id: sites.render-jekyll
    what: The Jekyll-theme option — render a site with the zer0-mistakes theme and deploy it with a Jekyll server (GitHub Pages' builder or a pinned container), with nothing Ruby in this repository.
    # P2: tools/jekyll_theme.py — a site's `render:` setting in workspace.yml, the export with the theme's tag pinned
    # and an Obsidian vault resolved, GitHub Pages' builder or the jekyll-4 image (tools/jekyll/Dockerfile); pages.yml,
    # sites.yml, drsai.yml and irony-works.yml build eight sites through it (ops). G4: a site's renderer, the theme's tag
    # and the Jekyll server are its registry fields, chosen over the API and in the studio (partial: running its build
    # as a job a person follows needs the Jekyll server's container, which the worker does not start — still to come).
    surfaces: {api: partial, studio: partial, ops: done}
    proof: {ops: tools/tests/test_jekyll_theme.py}
  - id: sites.obsidian
    what: Obsidian-flavoured content — wikilinks, embeds, callouts, Dataview queries, the graph index.
    # P2: zer0-pages's plugins ported to Python for the Jekyll-theme option (tools/obsidian, tests in tools/tests);
    # zer0-pages builds with its Ruby plugins until the two differences its option build shows are accepted (PLAN P2).
    surfaces: {api: partial, site: missing, ops: partial}
  - id: sites.deploy
    what: Build, preview and deploy each site, with history.
    surfaces: {api: missing, studio: missing, ops: partial}
  - id: sites.doctor
    what: Consistency checks over a site (config, image engine, CMS, fleet, distribution and content rules) as findings.
    # G4: content/sites/doctor.py — the Ruby doctor ported rule for rule but the theme's (ADR 0006 decision 4); a site's
    # doctor job keeps its findings (api, studio); `python -m sites.doctor`, `manage.py doctor`, `bin/zer0 doctor` and the
    # reusable zer0-doctor.yml run it (ops).
    surfaces: {api: done, studio: done, extension: partial, ops: done}
    proof:
      api: content/tests/sites/test_sites.py::test_the_doctor_job_records_its_findings
      studio: web/packages/ui/test/sites.test.tsx
      ops: content/tests/sites/test_doctor.py::test_each_scenario_matches_the_ruby_doctor
  - id: sites.monitor
    what: Scheduled uptime, broken-link, performance and Core Web Vitals, accessibility and SEO checks, with history, trends and alerts.
    surfaces: {api: missing, studio: missing, extension: missing, ops: missing}
  - id: sites.analytics
    what: Analytics ingest (GA4, Search Console, DataForSEO, product analytics) and content performance views.
    surfaces: {api: missing, studio: missing}
  - id: sites.evolve
    what: The improvement loop — an editorial plan per site, agents proposing improvements from the signals, outcome measurement.
    surfaces: {api: missing, studio: missing, mcp: missing}

  # ── AIEO (TARGET.md § AIEO in the platform) ─────────────────────────────────
  # G7: content/aieo/ (/api/v2/aieo/) and the studio's AIEO workspace (Sites → AIEO, web/packages/ui/src/aieo/) with
  # Write's Citability tab; the extension renders the same components once G10 hosts them.
  - id: aieo.scoring
    what: The analyzers and the five-dimension citability score of a page or a text, with evidence.
    # G7: the heuristics scored exactly as AIEO scored on the fixtures (test_analyzers.py, golden/source.json); a
    # model's evaluation through the AI layer's bundled evaluator, the heuristics as its fallback; over MCP as
    # aieo.score_text / aieo_score_content.
    surfaces: {api: done, studio: done, extension: missing, mcp: done}
    proof:
      api: content/tests/aieo/test_api.py::test_a_text_is_scored_at_once_and_nothing_is_recorded
      studio: web/packages/ui/test/aieo.test.tsx
      mcp: content/tests/aieo/test_tools.py::test_an_mcp_client_with_the_aieo_token_lists_aieos_tool_names_and_scores_a_text
  - id: aieo.audits
    what: Audits of a URL or a crawled site, and reports.
    # G7: audits of a text, a page, a URL or a site as runs, every fetch through research/fetch.py; history,
    # benchmark, link maps; AIEO's reports byte for byte; `manage.py aieo` (ops).
    surfaces: {api: done, studio: done, mcp: done, ops: done}
    proof:
      api: content/tests/aieo/test_audits.py::test_a_site_is_crawled_cheap_first_and_scored_page_by_page_with_its_link_map
      studio: web/packages/ui/test/aieo.test.tsx
      mcp: content/tests/aieo/test_tools.py::test_auditing_a_url_over_mcp_is_a_run_the_agent_owns
      ops: content/tests/aieo/test_commands.py::test_a_list_of_sites_is_audited_together_into_aieos_layout_and_reports
  - id: aieo.citations
    what: Citation tracking — whether AI engines cite the site, on a schedule.
    # G7: tracked questions asked of each engine (a provider) through the citation probe, on Celery beat; share of
    # voice per engine and by week.
    surfaces: {api: done, studio: done}
    proof:
      api: content/tests/aieo/test_citations.py::test_the_api_tracks_a_question_checks_it_and_reports_share_of_voice
      studio: web/packages/ui/test/aieo.test.tsx
  - id: aieo.optimize
    what: Rewrite content to raise its score (score → gaps → AI rewrite) or scrub AI-writing tells, as a suggestion.
    # G7: optimize, expand, scrub, rewrite — on a page as suggestions aligned block by block, on a text a draft; over
    # MCP an agent rewrites a text (only a person asks for suggestions on a page).
    surfaces: {api: done, studio: done, extension: missing, mcp: done}
    proof:
      api: content/tests/aieo/test_rewrites.py::test_optimizing_a_page_lands_its_rewrite_as_suggestions_not_a_revision
      studio: web/packages/ui/test/aieo.test.tsx
      mcp: content/tests/aieo/test_tools.py::test_aieos_agents_rewrites_and_patterns_over_mcp_are_runs_that_only_propose
  - id: aieo.patterns
    what: The pattern library and applying a pattern as a rewrite proposal.
    # G7: Pattern rows seeded from AIEO's pattern files, changed with aieo.change_pattern (the scorer reads the
    # change), applied to a page (suggestions) or a text (a draft).
    surfaces: {api: done, studio: done, extension: missing, mcp: done}
    proof:
      api: content/tests/aieo/test_api.py::test_everyone_reads_the_pattern_library_and_only_its_keepers_change_it
      studio: web/packages/ui/test/aieo.test.tsx
      mcp: content/tests/aieo/test_tools.py::test_aieos_agents_rewrites_and_patterns_over_mcp_are_runs_that_only_propose
  - id: aieo.agents
    what: The AIEO agents (SEO, meta, internal links, headlines, conversion and the rest) as agent definitions at suggest.
    # G7: the ten AIEO agents as bundled assistants of the AI layer (propose-only, each with its output schema, made
    # from AIEO's agent prompts) rather than agent definitions, as the overhaul's brief asked (PLAN G7, deviations);
    # they read the site's brand context and also appear in Write's AI panel.
    surfaces: {api: done, studio: done, mcp: done}
    proof:
      api: content/tests/aieo/test_lifecycle.py::test_every_aieo_agent_answers_with_its_schema_and_only_proposes
      studio: web/packages/ui/test/aieo.test.tsx
      mcp: content/tests/aieo/test_tools.py::test_aieos_agents_rewrites_and_patterns_over_mcp_are_runs_that_only_propose
