  - id: platform.feedback
    what: Report an issue or give page feedback into GitHub issue templates.
    surfaces: {studio: missing, site: missing}
  - id: platform.install
    what: First-run setup — the install wizard, ensure-admin, demo seed, operator commands.
    # P4: manage.py seed_demo; the wizard and ensure-admin to come.
    surfaces: {studio: missing, ops: partial}
  - id: platform.ops
    what: Liveness, readiness and version probes, request ids, the error envelope, JSON logs with redaction, throttles, CORS, security headers.
    surfaces: {ops: done}
    proof: {ops: content/tests/ops/test_health.py}
  - id: platform.observability
    what: Error reporting (Sentry, GitHub issues), metrics and traces.
    surfaces: {ops: partial}
  - id: platform.deploy
    what: Release images, a production compose file, a Helm chart, secrets from the environment or a secret store, backups.
    surfaces: {ops: missing}
  - id: platform.docs
    what: User, developer and API documentation, generated where it can be.
    surfaces: {ops: partial}
  - id: platform.workspace
    what: The repository's workspace tool — list, info, run, affected, matrix, routes, check, vendor, doctor, tags — in Python.
    # Every command is Python and tested (tools/workspace/tests/); since G4 `bin/zer0 doctor` runs the platform's doctor.
    surfaces: {ops: done}
    proof: {ops: tools/workspace/tests/test_workspace.py::DoctorTest}

  - id: platform.shared-ui
    what: One UI codebase — the studio and the extension's webviews render the same React workspaces from web/packages/ with the same libraries and generated client; the extension's own code is the VS Code host.
    # P4: the studio renders @zer0/ui's workspaces through the host contract (StudioProvider), and ESLint keeps routers, transports and page globals out of them; the extension's half is G10.
    surfaces: {studio: done, extension: missing}
    proof:
      studio: web/studio/test/app.test.tsx

  # ── The extension's own (file mode) ─────────────────────────────────────────
  - id: extension.file-mode
    what: The extension on a site's files with no server — front matter as controls, the dashboard, SEO insights, the governed publishing path and its ledger, the MCP server.
    surfaces: {extension: done}
    proof: {extension: src/test/core.test.ts}
  - id: extension.fleet-console
    what: The fleet console — lanes, kill switches, dispatch and runs across the owner's repositories.
    surfaces: {extension: done}
    proof: {extension: src/test/fleet.test.ts}

sources:
  - id: parodynews
    path: apps/parodynews
    summary: barodybroject — a Django + DRF + React app that generates (parody) news with AI assistants, runs them as pipelines over chat threads, and publishes posts as GitHub pull requests to a Jekyll sidecar site.
    content: The database (posts, front matter, versions, assistants, groups, schemas, content details and items, threads, messages, provider and model rows — dumped with dumpdata); the bundled schemas and prompt in parodynews/schema/; the sidecar site's 59 posts and its pages in src/pages/.
    capabilities:
    # G8 (2026-10-22): a capability is done when a person can use it from its workspace (ADR 0006 decision 15).
    # Done here: what is not a workspace's — the provider registry (a setting), the import (an operator's
    # command), ownership (a rule on every surface). The rows a person works with are partial until the studio
    # (P4, G10); `note` names the test that proves the platform's half (the API).
      - {id: parodynews.providers, what: "Four providers (Claude Code over OAuth, Anthropic, OpenAI, mock), pluggable by setting.", target: ai.providers, status: done, proof: content/tests/ai/test_providers.py::test_the_registry_has_six_adapters_and_takes_more_from_settings}
      - {id: parodynews.provider-config, what: "Staff set each provider's key, base URL, organization, project, default model and extras in the UI, enable it and pick the default; the database overrides the environment.", target: ai.providers, status: done, proof: web/packages/ui/test/ai/providers.test.tsx, note: "API: content/tests/ai/test_api.py::test_a_providers_configuration_is_validated_and_shown_only_to_those_who_configure_it; studio: AI → Providers → Configure (G8)"}
      - {id: parodynews.provider-test, what: "Send a test prompt to a provider.", target: ai.providers, status: done, proof: web/packages/ui/test/ai/providers.test.tsx, note: "API: content/tests/ai/test_api.py::test_staff_test_a_provider_sync_its_models_and_set_the_default; studio: AI → Providers → Test, the check followed as a run (G8)"}
      - {id: parodynews.model-sync, what: "List a vendor's models live and sync them into the catalog (UI, admin action, sync_models).", target: ai.models, status: done, proof: web/packages/ui/test/ai/providers.test.tsx, note: "API and manage.py sync_ai_models: content/tests/ai/test_api.py::test_staff_test_a_provider_sync_its_models_and_set_the_default, content/tests/ai/test_services.py::test_the_catalog_syncs_from_the_command_line; studio: AI → Providers → Sync models, and AI → Models (G8)"}
      - {id: parodynews.structured-output, what: "Generation enforces an assistant's JSON Schema (parse and validate).", target: ai.schemas, status: done, proof: web/packages/ui/test/ai/assistants.test.tsx, note: "API: content/tests/ai/test_services.py::test_a_structured_answer_is_validated_and_rendered_or_the_run_fails; studio: an assistant given an output schema, its answer shown as the validated JSON and the Markdown rendered from it (G8)"}
