  # ── Distribution ────────────────────────────────────────────────────────────
  - id: distribution.channels
    what: Channels — LinkedIn (OAuth, encrypted token), WordPress, GitHub pull request — connected per site.
    # G5: content/distribution (/api/v2/distribution/channels/) and the studio's Distribution → Channels — LinkedIn, WordPress, a GitHub repository as pull requests and a newsroom newsletter, per site; a credential encrypted with the AI layer's keys and never returned; LinkedIn connected with state and PKCE, the code exchanged on the worker; Check it on the worker; armed by a channel manager and by the deployment's switch for the kind.
    surfaces: {api: done, studio: done}
    proof:
      api: content/tests/distribution/test_platform.py::test_connecting_linkedin_is_state_and_pkce_one_use_and_the_code_is_exchanged_on_the_worker
