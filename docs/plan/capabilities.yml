  - id: research.sources
    what: A sources library — web pages, feeds, documents and notes with extracted text, metadata, summaries and entities — with quotes, citations and collections.
    # G14: content/research (/api/v2/research/) and the studio's Research workspace and source page; collections and sources shared from the studio (only the owner changes who sees one).
    surfaces: {api: done, studio: done, extension: missing, mcp: missing}
