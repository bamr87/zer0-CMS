    capabilities:
      - {id: rails.site-registry, what: "Register a site, or discover and sync everything under SITES_DIR; per-collection counts; read-only _config.yml.", target: sites.registry, status: specified, decided_by: "the owner, 2026-10-27: delete the Rails CMS and keep only the specs of what the platform still has to build (ADR 0008)", spec: docs/plan/rails-cms-spec.md#railssite-registry, note: "G4: register, discover (SITES_DIR and workspace.yml) and sync, from the API and the studio (content/tests/sites/test_sites.py). Open: per-collection counts (the overview counts pages, live and drafts) and the read-only _config.yml view"}
