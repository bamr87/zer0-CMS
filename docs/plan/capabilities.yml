      - {id: aieo.agents-cro, what: "Agents cro-analyst and landing-page-optimizer.", target: aieo.agents, status: done, proof: "content/tests/aieo/test_lifecycle.py::test_every_aieo_agent_answers_with_its_schema_and_only_proposes"}
