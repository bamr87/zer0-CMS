  - id: distribution.queue
    what: Compose, brand guard, approve and publish to a channel, with the ledger keyed by canonical URL and readable errors.
    # G5: posts of a page or a story, always drafts — by a person (Distribute in the editor and a story's panel), an agent (distribution.compose, over MCP too) or the published-page consumer; the brand guard's findings on the post; approval by someone who may publish the page; publishing answers 202 and the worker checks every gate again (distribution/gates.py) before LinkedIn, WordPress, GitHub or the newsletter; the ledger keyed by canonical URL in the extension's byte format, downloaded and imported. A site that is still files keeps the same lane in its CI (manage.py linkedin). Extension partial: it keeps its own file-mode publishing lane until it is the platform's client (G10).
