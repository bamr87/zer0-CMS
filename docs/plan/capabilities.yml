      studio: web/packages/ui/test/distribution.test.tsx
      mcp: content/tests/distribution/test_platform.py::test_an_mcp_client_with_the_distribution_token_drafts_and_cannot_publish
  - id: distribution.stats
    what: Statistics for published posts, ingested and reported.
    # G5: LinkedIn's aggregate counts for a channel's own posts, daily on beat (distribution-statistics) or on request, one row per post a day, in the studio's Distribution → Statistics and beside each ledger entry. LinkedIn is the only channel with statistics: WordPress, pull requests and newsletters report none.
    surfaces: {api: done, studio: done}
    proof:
      api: content/tests/distribution/test_platform.py::test_statistics_are_ingested_per_post_and_day_and_shown_with_the_ledger
