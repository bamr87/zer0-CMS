  - id: aieo
    path: apps/aieo
    summary: AIEO (AI Engine Optimization) — FastAPI + SQLAlchemy + Celery + React; scores and rewrites content so AI engines cite it, runs a file-based content lifecycle, and audits whole sites.
    content: backend/prompts/** (system, scoring rubric, optimize-expand, 10 pattern files, 14 agent prompts, 7 command prompts → pattern snippets and agent definitions); the PATTERNS table; the workspace CONTEXT_TEMPLATES and examples/{castos,starter} brand voices (→ BrandRules, Memory, site settings); reports/ (10 site audits, REPORT.md, summary.json) and sites.txt (→ audit history); wordpress/*.php; docs/*.md and PRD-aieo.md (its never-built "planned" features are inputs to G7/G13 scope, not rows here); runtime data outside git — any operator's .aieo-workspace/ and its .cache, and near-empty Postgres rows (users, api_keys, citations, audits).
    capabilities:
      # From the 2026-10-21 code inventory. "stub" means the source fakes it, so absorbing it means building it.
      - {id: aieo.audit, what: "Score pasted Markdown/HTML or a fetched URL: 0–100 and a grade, per-pattern evidence, gaps, anti-pattern penalties, the five dimensions.", target: aieo.scoring, status: done, proof: "content/tests/aieo/test_audits.py::test_a_text_audit_is_a_run_the_evaluator_scores_with_aieos_prompt_and_schema", note: "and a URL through the guard (test_a_url_is_fetched_through_the_guard_and_robots_txt_is_honoured); the studio's Audit tab (web/packages/ui/test/aieo.test.tsx)"}
      - {id: aieo.scoring-engine, what: "The prompt-driven evaluator — system prompt, rubric and pattern files build a prompt that returns structured scores — with heuristic fallbacks.", target: aieo.scoring, status: done, proof: "content/tests/aieo/test_audits.py::test_a_provider_that_fails_leaves_the_heuristic_score_and_says_why", note: "the bundled AIEO evaluator through the AI layer, its prompt byte for byte AIEO's (test_analyzers.py::test_the_bundled_patterns_and_the_evaluators_prompt_are_aieos)"}
      - {id: aieo.dim-aieo, what: "Dimension aieo: ten citability patterns (structured data, entity density, comparisons and the rest) with weights.", target: aieo.scoring, status: done, proof: "content/tests/aieo/test_analyzers.py::test_a_markdown_document_parses_and_scores_as_aieo_scored_it"}
      - {id: aieo.dim-seo, what: "Dimension seo: SEO quality, keyword density and placement, search intent, content-length comparison.", target: aieo.scoring, status: done, proof: "content/tests/aieo/test_analyzers.py::test_every_analyzer_returns_what_aieo_returned", note: "a site's target keywords feed the keyword analysis (test_audits.py)"}
      - {id: aieo.dim-readability, what: "Dimension readability: readability metrics.", target: aieo.scoring, status: done, proof: "content/tests/aieo/test_analyzers.py::test_every_analyzer_returns_what_aieo_returned"}
      - {id: aieo.dim-humanity, what: "Dimension humanity: the humanity and quality score.", target: aieo.scoring, status: done, proof: "content/tests/aieo/test_analyzers.py::test_every_analyzer_returns_what_aieo_returned"}
      - {id: aieo.dim-cro, what: "Dimension cro: above-the-fold, CTA and trust-signal analysis with the CRO checklist.", target: aieo.scoring, status: done, proof: "content/tests/aieo/test_analyzers.py::test_every_analyzer_returns_what_aieo_returned"}
      - {id: aieo.analyzers-extra, what: "The engagement and competitor-gap analyzers (exported, wired to nothing).", target: aieo.scoring, status: done, proof: "content/tests/aieo/test_audits.py::test_a_heuristic_audit_asks_no_model_and_reads_the_sites_keywords", note: "wired into every score: competitor gaps against the brand context's competitor topics"}
      - {id: aieo.benchmark, what: "Percentile and per-engine estimates on each audit (stub: fixed buckets).", target: aieo.scoring, status: done, proof: "content/tests/aieo/test_audits.py::test_an_audit_is_benchmarked_against_the_others_and_the_engines_that_cite_its_domain", note: "real now: the percentile among the platform's audits of its kind, and per engine how often the tracked questions' answers cited its domain"}
      - {id: aieo.visual-audit, what: "Screenshot a URL (Playwright, 1280×800) and score it with vision alongside the text.", target: aieo.audits, status: done, proof: "content/tests/aieo/test_audits.py::test_the_visual_audit_screenshots_the_page_and_the_evaluator_sees_it", note: "behind AIEO_VISUAL_AUDIT, Playwright an optional install whose every request goes through research/fetch.py (test_every_request_the_browser_makes_goes_through_the_guarded_fetcher); the browser itself is faked in tests, never run in CI; the screenshot reaches the providers that declare vision (anthropic, openai)"}
      - {id: aieo.analyze-existing, what: "Analyze a URL or a workspace file: score plus an AI summary (health, quick wins, strategic actions).", target: aieo.audits, status: done, proof: "content/tests/aieo/test_commands.py::test_a_url_is_fetched_through_the_guard_and_ai_records_an_audit", note: "an audit with a model's evaluation: the assessment, executive summary and priority actions; a page stands for a workspace file"}
      - {id: aieo.site-snapshot, what: "Crawl a static site (sitemap → feed → robots → links; robots-aware, SSRF guard, ETag cache) into an offline snapshot.", target: aieo.audits, status: partial, note: "manage.py aieo crawl writes snapshot.json, .md and .txt (test_commands.py::test_a_site_is_crawled_into_an_offline_snapshot), robots-aware, every request through the SSRF guard; not yet: the ETag/conditional-GET cache between crawls and AIEO's PDF, HTML and bundle exports"}
      - {id: aieo.batch-audit, what: "Batch-audit a list of sites directly or over MCP.", target: aieo.audits, status: done, proof: "content/tests/aieo/test_commands.py::test_a_list_of_sites_is_audited_together_into_aieos_layout_and_reports", note: "audits/batch/ and the studio's Reports tab (test_api.py, aieo.test.tsx); over MCP each site with aieo_audit_url (test_tools.py)"}
      - {id: aieo.reports, what: "Per-site Markdown reports and a summary report (rankings, score bars, severity) from audit JSON.", target: aieo.audits, status: done, proof: "content/tests/aieo/test_audits.py::test_aieos_ten_site_audits_import_as_history_and_report_as_aieo_reported_them", note: "byte for byte AIEO's for its ten imported site audits; HTML too; downloaded from an audit or a batch (test_api.py) or written by manage.py aieo report"}
      - {id: aieo.headless-runner, what: "A database-free CI runner that scores or optimizes Markdown selected by globs or a git diff, with dry run.", target: aieo.audits, status: done, proof: "content/tests/aieo/test_commands.py::test_the_headless_runner_follows_a_git_diff_and_proposes_rewrites_never_in_place", note: "manage.py aieo run: scoring needs no database; optimizing records its runs like every AI generation, and writes proposed/ for a person, never in place (AIEO's --apply-in-place is not carried)"}
      - {id: aieo.ci-workflows, what: "A reusable workflow that scores or optimizes another repository's Markdown and can commit the result.", target: workflows.automations, status: missing, note: "the runner it would call exists (manage.py aieo run); the workflow and committing a rewrite belong to automations (PLAN G16)"}
      - {id: aieo.optimize, what: "Rewrite content to raise its score — score, gaps, AI rewrite (preserve or aggressive; enhance or expand).", target: aieo.optimize, status: done, proof: "content/tests/aieo/test_rewrites.py::test_optimizing_a_page_lands_its_rewrite_as_suggestions_not_a_revision"}
      - {id: aieo.scrub, what: "Remove AI-writing tells from a draft.", target: aieo.optimize, status: done, proof: "content/tests/aieo/test_rewrites.py::test_scrubbing_a_text_is_a_draft_in_the_runs_output"}
      - {id: aieo.patterns, what: "Browse the pattern library (category, description, citation-boost range) and fetch a pattern (apply is a stub).", target: aieo.patterns, status: done, proof: "content/tests/aieo/test_rewrites.py::test_applying_a_pattern_over_the_api_rewrites_with_that_pattern", note: "apply is real now: a rewrite with the pattern's criteria, suggestions on a page"}
      - {id: aieo.prompt-library, what: "Change scoring and agent behaviour by editing Markdown prompts with front-matter weights, no code change.", target: aieo.patterns, status: done, proof: "content/tests/aieo/test_commands.py::test_the_prompt_importer_keeps_a_persons_change_unless_forced", note: "the patterns and the assistants are rows a person edits in the studio (test_api.py), and import-prompts re-reads a prompts directory"}
      - {id: aieo.providers, what: "Pick the AI engine per request or by environment: OpenAI, Anthropic, Claude Code over OAuth, xAI.", target: ai.providers, status: done, proof: "content/tests/aieo/test_audits.py::test_an_audit_can_name_the_engine_that_evaluates_it", note: "the AI layer's providers (xAI through litellm); an audit names one, or the default by AI_DEFAULT_PROVIDER or the default row"}
      - {id: aieo.agent-runner, what: "Run any agent prompt on pasted content with the workspace context injected.", target: ai.assistants, status: done, proof: "content/tests/aieo/test_api.py::test_the_aieo_agents_are_listed_and_run_with_the_sites_context"}
      - {id: aieo.agents-seo, what: "Agents seo-optimizer, meta-creator and keyword mapping.", target: aieo.agents, status: done, proof: "content/tests/aieo/test_lifecycle.py::test_every_aieo_agent_answers_with_its_schema_and_only_proposes"}
      - {id: aieo.agent-editor, what: "Agent editor ('human editor'): clarity, flow, human voice, a humanity score and a rewritten excerpt.", target: aieo.agents, status: done, proof: "content/tests/aieo/test_lifecycle.py::test_every_aieo_agent_answers_with_its_schema_and_only_proposes"}
      - {id: aieo.agent-headlines, what: "Agent headline-generator: variants, rationale, a testing plan.", target: aieo.agents, status: done, proof: "content/tests/aieo/test_lifecycle.py::test_every_aieo_agent_answers_with_its_schema_and_only_proposes"}
