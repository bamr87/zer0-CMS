# =============================================================================
# The Sunday Braise — Jekyll configuration
# Generated by the zer0-mistakes Site Builder on 2026-09-08
# Theme: https://github.com/bamr87/zer0-mistakes · Docs: https://jekyllrb.com/docs/configuration/
# =============================================================================

# ── Setup flag ─────────────────────────────────────────────────────
# true hides the welcome / setup screens the theme shows to fresh sites.
site_configured          : true

# ── Site identity ──────────────────────────────────────────────────
title                    : "The Sunday Braise"
subtitle                 : "Slow food for the day you have time"
tagline                  : "One pot, low heat, and the patience to leave it alone"
description              : "A small cookbook of braises, stews and slow-cooked one-pot food, with scalable quantities and timings you can trust."
founder                  : "Nour Haddad"
email                    : "nour@sundaybraise.example"
title_icon               : "egg-fried"
locale                   : "en-US"
# Generated monogram — replace with your own image under assets/images/.
logo                     : /assets/images/logo.svg

# ── GitHub ─────────────────────────────────────────────────────────
github_user              : &github_user "bamr87"
repository_name          : &github_repository "zer0-demo-cookbook"
repository               : [*github_user, "/", *github_repository]

# ── URLs & deployment ──────────────────────────────────────────────
#   user/org site  → url: https://<user>.github.io   baseurl: ""
#   project site   → url: https://<user>.github.io   baseurl: "/repo"
url                      : "https://bamr87.github.io"
baseurl                  : "/zer0-demo-cookbook"
remote_theme             : "bamr87/zer0-mistakes"
permalink                : /:categories/:title/
port                     : 4400

# ── Build ──────────────────────────────────────────────────────────
markdown                 : kramdown
highlighter              : rouge
public_folder            : assets
# Collections live under pages/_<name>/ — collections_dir is the key Jekyll
# reads; pages_dir is the theme's own alias for the same folder.
collections_dir          : pages
pages_dir                : pages
kramdown:
  input: GFM
  syntax_highlighter: rouge

# ── Collections (pages/_<name>/) ───────────────────────────────────
collections:
  posts:
    output: true
    permalink: /posts/:title/
  about:
    output: true
    permalink: /about/:path/
  recipes:
    output: true
    permalink: /recipes/:path/

# ── Default front matter ───────────────────────────────────────────
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "article"
      author: "default"
  - scope:
      path: ""
      type: "about"
    values:
      layout: "default"
  - scope:
      path: ""
      type: "recipes"
    values:
      layout: "recipe"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"

# ── Plugins (all GitHub Pages–safe) ────────────────────────────────
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-include-cache
  - jekyll-paginate
  - jekyll-remote-theme

# ── Appearance ─────────────────────────────────────────────────────
# Skin = base palette + backgrounds; assets/css/user-overrides.css layers the
# palette, fonts and corner radius chosen in the Site Builder on top.
# user_overrides is what makes the theme LINK that stylesheet (core/head.html);
# without it the file ships but nothing on the site changes.
user_overrides           : true
theme_skin               : "dirt"   # air | aqua | dirt | neon | mint | plum | sunrise
color_mode_default       : auto     # auto | light | dark
color_mode_lock          : false
theme_background:
  enabled: true

# ── Author (used by article layouts) ───────────────────────────────
author:
  name: "Nour Haddad"
  email: "nour@sundaybraise.example"
  bio: "One pot, low heat, and the patience to leave it alone"

# ── Integrations ───────────────────────────────────────────────────
# Keys never live here. Analytics run only in production after consent.
google_analytics         : ""
posthog:
  enabled: false
  api_key: ""
cookie_consent:
  enabled: true
  expiry_days: 365
giscus:
  enabled: false
  data-repo-id: ""
  data-category-id: ""
obsidian:
  enabled: true
page_feedback:
  enabled: true
  mode: url                 # pre-filled github.com issue forms; no token needed
  default_labels: ["page-feedback"]
ai_chat:
  enabled: false
  provider: anthropic       # anthropic (Claude) | xai (Grok) — the proxy needs the matching key
  auth_mode: proxy
  proxy_ready: false        # set true once templates/deploy/chat-proxy is deployed
  endpoint: "/api/chat"

# ── Exclude from build ─────────────────────────────────────────────
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - .jekyll-metadata
  - node_modules/
  - vendor/
  - Gemfile.lock
  - docker-compose.yml
  - zer0.install.yml
  - .env
  - .env.example
  - README.md
  - "*.log"
