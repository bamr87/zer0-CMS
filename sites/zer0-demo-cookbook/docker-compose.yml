# The Sunday Braise — development server
# Generated by the zer0-mistakes Site Builder. Start with: docker compose up
services:
  jekyll:
    image: ruby:3.3
    working_dir: /site
    command: >-
      sh -c "bundle config set --local path vendor/bundle
      && (bundle check || bundle install --jobs 4 --retry 3)
      && bundle exec jekyll serve --watch --livereload --livereload-port 4401 --force_polling
      --config _config.yml,_config_dev.yml --host 0.0.0.0 --port 4400"
    ports:
      - "4400:4400"
      - "4401:4401"   # LiveReload on port+1, so two Jekyll sites can run side by side
    volumes:
      - .:/site
      - bundle_cache:/site/vendor/bundle
    environment:
      JEKYLL_ENV: development
      PAGES_REPO_NWO: bamr87/zer0-demo-cookbook
    stdin_open: true
    tty: true

volumes:
  bundle_cache:
    # Shared across every site generated by the Site Builder, so the second
    # site does not reinstall the same gems. Drop the name for a private cache.
    name: zer0-sites-bundle-cache
