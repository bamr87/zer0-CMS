# Development overrides — layer on top of _config.yml:
#   bundle exec jekyll serve --config _config.yml,_config_dev.yml
#
# Builds against a LOCAL checkout of the zer0-mistakes theme instead of the
# remote theme (required while theme changes are unreleased):
#   ZER0_THEME_LOCAL=../../packages/zer0-mistakes bundle install
#
# NOTE: Jekyll replaces (does not merge) the `plugins:` list; this slim list
# intentionally drops jekyll-remote-theme so dev builds never hit the network.

remote_theme: false
theme: jekyll-theme-zer0

url: "http://localhost:4000"
baseurl: ""

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-relative-links
  - jekyll-include-cache

sass:
  style: expanded
  sourcemap: always
