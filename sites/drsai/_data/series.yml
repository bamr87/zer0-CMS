# ─────────────────────────────────────────────────────────────────────────────
# Book series / categories for the drsai library.
#
# The `books` collection groups its shelves by each book's `series:` front
# matter; this file supplies the display metadata for each series id. The theme
# looks it up as `site.data.series[book.series]`. Books with no `series:` fall
# under the default "Stories" shelf.
# ─────────────────────────────────────────────────────────────────────────────
abc-language:
  title: "ABC & Language"
  tagline: "First alphabets — one letter, one word, one picture."
  icon: "bi-type"
  audience: "Ages 1–4"
  order: 1
  description: >-
    Toddler board books that turn a big theme into its ABCs. Each page is one
    friendly letter, a word to say out loud, and a picture to point at —
    generated by the zer0-CMS ABC wizard and illustrated with a single, consistent
    art style. A is for Automation; Z is for Zero Trust.

stories:
  title: "Stories"
  tagline: "Picture books to read cover to cover."
  icon: "bi-book-half"
  order: 2
  description: >-
    Longer, illustrated read-aloud stories — a chapter (or a month) at a time.
