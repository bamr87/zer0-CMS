# _data/landing.yml — content for the landing page (index.md renders it).
# Generated by the zer0-mistakes Site Builder from your site plan. Edit freely:
# hero.{eyebrow,headline,subheadline,align,variant,ctas[]} and sections[] of type
# features | cards | steps | stats | faq | cta | latest_posts | quote | text.
template: "editorial"
hero:
  eyebrow: "Digital garden"
  headline: "Ideas are worth more connected than collected"
  subheadline: "Short notes, revised in place, each one showing what links to it. Start anywhere and follow the links."
  align: "start"
  variant: "default"
  ctas:
    - label: "Wander the notes"
      url: "/notes/"
      variant: "primary"
      icon: "bi-diagram-2"
    - label: "Why a garden"
      url: "/notes/why-gardens-beat-blogs/"
      variant: "secondary"
      icon: "bi-signpost-2"
sections:
  - id: "recent"
    type: "latest_posts"
    heading: "Recently tended"
    limit: 3
  - id: "how-to-read"
    type: "text"
    heading: "How to read this"
    body: |-
      There is no order. The notes point at each other with `[[wiki-links]]`, and every note lists its backlinks at the bottom — the notes that needed it.
      
      If you want a path: start at **Evergreen notes**, follow it to **Notes should be atomic**, and let the links take you sideways from there. Most of the value is in the sideways.
  - id: "garden-yours"
    type: "cta"
    heading: "Growing your own?"
    lead: "This whole site is a folder of Markdown files. Open it in Obsidian and the links work identically."
    cta:
      label: "See how it is built"
      url: "/about/"
