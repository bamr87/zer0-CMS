    image: /assets/images/wargames/banner-semtex.svg
    badge: Offline
    badge_variant: secondary
    description: "Network programming, covert channels and reverse engineering. Offline, but a good syllabus."
    meta:
      - { icon: bi-layers, text: "13 levels" }
  - title: Blacksun
    url: /docs/wargames/blacksun/
    icon: bi-brightness-high
    image: /assets/images/wargames/banner-blacksun.svg
    badge: Down
    badge_variant: secondary
    description: "Exploiting hardened hosts: ASLR, non-executable memory and stack protection."
