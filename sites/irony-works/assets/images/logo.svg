<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Irony Works">
  <title>Irony Works</title>
  <!-- Expectation, reversed: an arrow that turns back on the path it came from. -->
  <circle cx="32" cy="32" r="30" fill="#1b1b1f"/>
  <g fill="none" stroke="#e8e4d9" stroke-width="4.5" stroke-linecap="round">
    <!-- the expectation: a forward arc, broken where it reverses -->
    <path d="M15 38a17 17 0 0 1 30-10.5" stroke-linejoin="round"/>
    <!-- the reversal: the return arc -->
    <path d="M49 26a17 17 0 0 1-30 10.5"/>
  </g>
  <!-- arrowheads pointing opposite ways: the reversal is the point -->
  <path d="M45 27.5l-1.5-7.5 7.5 1.5z" fill="#e8e4d9"/>
  <path d="M19 36.5l1.5 7.5-7.5-1.5z" fill="#e8e4d9"/>
</svg>
