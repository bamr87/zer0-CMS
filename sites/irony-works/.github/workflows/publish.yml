# Vault → site: transplant wikilinks into a Jekyll collection, build with
# zer0-mistakes (remote theme), deploy to GitHub Pages. The vault stays the
# source of truth; the site is a pressing.
name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Render previews + transplant vault → _entries/
        run: |
          npm i js-yaml --no-save
          node engine/scripts/preview.mjs
          node engine/scripts/transplant.mjs

      - uses: actions/configure-pages@v6

      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - uses: actions/upload-pages-artifact@v5

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
