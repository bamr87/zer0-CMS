        - paragraph [ref=f2e73]: Steve Sasson’s 1975 prototype — eight pounds, a cassette tape, twenty-three seconds per image — was, by his telling, received by management as a curiosity best kept quiet, since Kodak’s margins lived in film and paper. The company even understood the future well enough to forecast it internally; it simply could not act against its own revenue. Thirty-seven years later the drawer opened from the outside.
        - paragraph [ref=f2e74]:
          - text: This is the vault’s cleanest specimen of institutional
          - link "Situational Irony" [ref=f2e75] [cursor=pointer]:
            - /url: /irony-works/entries/situational/
          - text: irony because the reversal was
          - strong [ref=f2e76]: self-authored twice
          - text: ": Kodak invented its disruptor, and then Kodak’s defense against the disruptor — burying it — guaranteed others would commercialize it first. The phrase “Kodak moment,” coined to mean a scene worth preserving, now denotes the instant an incumbent meets the future it invented. The language itself performed the reversal."
