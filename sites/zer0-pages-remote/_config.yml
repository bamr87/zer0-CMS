# ----------------------------------------------------------------------
# Bare-minimum Jekyll configuration for GitHub Pages remote-theme demo.
# Three files required: _config.yml, Gemfile, index.md.
# ----------------------------------------------------------------------

title:        "zer0-pages-remote"
description:  "Minimal site rendered by the bamr87/zer0-mistakes remote theme."
url:          ""
baseurl:      ""

# Pull layouts/includes/styles from the published theme on GitHub
remote_theme: bamr87/zer0-mistakes

# GitHub Pages whitelisted plugins.
# This list is the only thing that registers a plugin: GitHub Pages builds in
# safe mode, so a gem in the Gemfile but absent here never loads. Keep the two
# in sync in both directions.
plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  # Required by the remote theme: _layouts/root.html renders
  # {% include_cached %}, which only exists once this plugin is registered.
  # Without it every build dies on "Unknown tag 'include_cached'".
  - jekyll-include-cache

# When false (or unset with placeholder title), the welcome layout
# shows the setup wizard. Flip to `true` once you've personalised
# this file to hide the onboarding screen.
site_configured: false

# Markdown
markdown: kramdown
kramdown:
  input: GFM

# Keep tooling and agent docs out of the published demo. Without AGENTS.md, CLAUDE.md and
# tools/ listed here, Jekyll renders them into the site (/CLAUDE.html and
# /tools/unwrap-prose.py were both being served live).
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - .github
  - docker-compose.yml
  - AGENTS.md
  - CLAUDE.md
  - tools
