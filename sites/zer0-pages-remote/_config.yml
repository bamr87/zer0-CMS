# =============================================================================
# Zer0-Mistakes Remote Theme Configuration
# =============================================================================
# This is a minimal _config.yml for GitHub Pages sites that load the
# zer0-mistakes theme remotely. No local theme files are needed — layouts,
# includes, assets, and styles are all pulled from the remote theme repo.
#
# Theme: https://github.com/bamr87/zer0-mistakes
# Docs:  https://bamr87.github.io/zer0-pages-remote/docs/
# =============================================================================

# ── Setup Flag ────────────────────────────────────────────────────────────────
# Set to true once you've personalised the fields below.
# While false (or absent), the theme shows a setup guide on the 404 page.
site_configured          : true

# ── Site Identity ─────────────────────────────────────────────────────────────
title                    : "zer0-pages-remote"
subtitle                 : "A site built with Zer0-Mistakes Jekyll Theme"
description              : "A Jekyll site built with zer0-mistakes"
founder                  : "Amr Abdel-Motaleb"
email                    : "amr@zer0-mistakes.com"

# ── GitHub ────────────────────────────────────────────────────────────────────
github_user              : &github_user "bamr87"
repository_name          : &github_repository "zer0-pages-remote"

# ── URLs & Deployment ─────────────────────────────────────────────────────────
#
#   Scenario A — User/Org site  (<user>.github.io repo):
#     url:     "https://<user>.github.io"
#     baseurl: ""
#
#   Scenario B — Project site   (any other repo name):
#     url:     "https://<user>.github.io"
#     baseurl: "/repo-name"
#
#   Scenario C — Custom domain:
#     url:     "https://yourdomain.com"
#     baseurl: ""
#
url                      : "https://bamr87.github.io"
baseurl                  : "/zer0-pages-remote"
remote_theme             : "bamr87/zer0-mistakes"
permalink                : /:categories/:title/

# ── Build Settings ────────────────────────────────────────────────────────────
markdown                 : kramdown
highlighter              : rouge
pages_dir                : pages

# ── Collections ───────────────────────────────────────────────────────────────
collections:
  posts:
    output               : true
    permalink            : /posts/:title/
  docs:
    output               : true
    permalink            : /docs/:path/
  about:
    output               : true
    permalink            : /about/:path/

# ── Default Front Matter ─────────────────────────────────────────────────────
defaults:
  - scope:
      path               : ""
      type               : "posts"
    values:
      layout             : "article"
      author             : "default"
  - scope:
      path               : ""
      type               : "docs"
    values:
      layout             : "default"
  - scope:
      path               : ""
      type               : "about"
    values:
      layout             : "default"
  - scope:
      path               : ""
      type               : "pages"
    values:
      layout             : "default"

# ── Plugins ───────────────────────────────────────────────────────────────────
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-remote-theme

# ── Exclude from Build ────────────────────────────────────────────────────────
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - vendor/                 # bundler install dir on CI
  - .bundle/
  - node_modules/
  - .backup-pre-install/
  - .github/
