# ==============================================================================
# Docker Compose - zer0-pages-remote Development
# ==============================================================================
#
# Content-only repo that uses remote_theme: "bamr87/zer0-mistakes".
# No custom Dockerfile needed — uses the official ruby:3.3 image directly.
#
# Prerequisites:
#   - GITHUB_TOKEN env var set (needed by jekyll-remote-theme to fetch the
#     theme from GitHub and avoid API rate limits)
#     export GITHUB_TOKEN=ghp_...
#
# Usage:
#   docker compose up              # Start dev server (first run installs gems)
#   docker compose up --build      # Re-run bundle install with latest deps
#   docker compose exec jekyll bash  # Access container shell
#
# Site available at: http://localhost:4000/zer0-pages-remote/
#   (baseurl matches the GitHub Pages subpath defined in _config.yml)
# ==============================================================================

services:
  jekyll:
    image: ruby:3.3

    # Apple Silicon compatibility
    platform: linux/amd64

    # Install any missing native-build deps, then bundle and serve.
    # libyaml-dev / zlib1g-dev are occasionally absent in the base image.
    # Using sh -c with a single-quoted heredoc-style string to avoid YAML
    # folded-scalar pitfall where continuation lines become separate commands.
    command:
      - sh
      - -c
      - |
        apt-get update -qq &&
        apt-get install -y --no-install-recommends libyaml-dev zlib1g-dev git &&
        rm -rf /var/lib/apt/lists/* &&
        gem install bundler &&
        bundle install --jobs 4 --retry 3 &&
        bundle exec jekyll serve --watch --force_polling --host 0.0.0.0 --port 4000 --livereload --config '_config.yml,_config_dev.yml'

    working_dir: /site

    volumes:
      - .:/site
      # Named volume keeps installed gems between restarts (much faster)
      - bundle_cache:/usr/local/bundle
      # ── Local theme development overrides ──────────────────────────────────
      # Mount local zer0-mistakes includes so changes are picked up without
      # pushing to GitHub. Site files take precedence over remote_theme files,
      # so these bind-mounts shadow the same paths downloaded by jekyll-remote-theme.
      # Remove these lines (or comment out) to revert to GitHub remote_theme.
      - /Users/bamr87/github/zer0-mistakes/_includes/navigation:/site/_includes/navigation:ro
      - /Users/bamr87/github/zer0-mistakes/_includes/core:/site/_includes/core:ro

    ports:
      - "4000:4000"
      - "35729:35729"   # LiveReload

    environment:
      - JEKYLL_ENV=development
      - BUNDLE_PATH=/usr/local/bundle
      # Required by jekyll-remote-theme to fetch bamr87/zer0-mistakes
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      # Tells jekyll-github-metadata which repo this is
      - PAGES_REPO_NWO=bamr87/zer0-pages-remote

    stdin_open: true
    tty: true

volumes:
  bundle_cache:
    driver: local
