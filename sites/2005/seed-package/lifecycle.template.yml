# lifecycle.template.yml — copy to lifecycle.yml in the first repo of a new lineage and fill
# in the <placeholders>. This is the only file (besides secrets) you configure by hand.
#
# Maintained afterwards by the `check-lifecycle` skill (tick reconciliation against seed.md §8)
# and by the `replant` / `consolidate` prompts (phase transitions).
# Hand-edit only the `policy` block, and only to deliberately change the knobs.
# Design doc: LIFECYCLE.md. Concept-agnostic framework; instance-specific values
# live here, exactly like the Concept Definition lives in seed.md §1.

lifecycle:
  policy:
    # Growth ticks per generation before this repo replants and spawns a successor.
    replant_after_ticks: 3
    # Lineage size (excluding the reference origin) that triggers consolidation.
    consolidate_at_members: 7
    succession:
      # Natural-language rule the replant prompt follows to derive the successor concept.
      # Examples: "Increment the calendar year of the newest lineage member by one
      # (the year 1776 -> the year 1777)." / "Advance to the next album in the band's
      # discography." / "Move to the next major release of the technology."
      rule: "<how to derive the next concept from the newest lineage member>"
    consolidation:
      # Naming rule for the consolidated repository.
      # Example: "Hyphenated range of the lineage's years, oldest-newest (e.g. 1776-1782)."
      naming_rule: "<how to name the merged repo from the member subjects>"
      # Layout rule for merged content inside the consolidated repository.
      # Example: "One top-level directory per lineage member, named by its subject slug."
      layout: "One top-level directory per lineage member, named by its subject slug."
    models:
      # Model the scheduled tick runs on (read by .github/workflows/grow.yml).
      # Growth ticks are research + writing + mechanical structure work — Sonnet-tier.
      # Raise to an Opus-tier model only for one-off hard interventions.
      tick: "claude-sonnet-4-6"
      # Frontier model for the one-time lineage meta-review (/distill).
      distill: "claude-fable-5"
    # Lineage size that triggers the one-time distillation meta-review.
    distill_at_members: 3

  state:
    # growing | mature (replanted; successor spawned) | consolidated (merged + archived)
    status: growing
    # Set by /distill when the lineage meta-review has run (null = pending).
    distilled_at: null
    # Growth ticks recorded in seed.md §8 since the most recent Genesis or Replant entry.
    # seed.md §8 is the source of truth; check-lifecycle reconciles this number each tick.
    generation_ticks: 0
    # Reference instance the framework was inherited from. NOT counted toward consolidation.
    origin: "<owner/repo the framework was copied from, e.g. year-of-ai/2005>"
    # Spawn chain, oldest first. Carried forward (and appended to) by every spawn,
    # so the newest member always knows the full family and when it reaches the
    # consolidation threshold. The FIRST member's lifecycle.yml doubles as the lineage
    # registry that the shepherd/distill phase resolver reads — replanting members
    # register their successors back into it.
    lineage:
      - subject: "<the starting concept, e.g. 'the year 1776'>"
        repo: "<owner>/<first-repo-slug>"
        status: growing
        spawned_from: "<same as origin>"
