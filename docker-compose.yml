# zer0-CMS — the platform (Django + Wagtail, docs/adr/0004-one-platform.md)
# behind `--profile content`, and, until its functions have moved into it, the
# image generator's panel behind `--profile imagegen`. The Rails fleet CMS that
# ran here without a profile is gone (docs/adr/0008-retire-the-rails-cms.md).
#
#   docker compose --profile content up -d --wait # the platform on :8000
#   docker compose --profile imagegen up --build  # zer0-image-generator on :3000
#
# The content profile is Postgres with pgvector, Redis, the Django app on
# gunicorn's threaded workers (content/gunicorn.conf.py, so a run's event
# stream holds a thread, not a worker)
# (/studio/ — the React studio its image builds from web/ —, /healthz, /readyz,
# /version, /admin/, /graphql/, /api/v2/, /mcp/), a Celery worker and beat
# (agent runs, scheduled publishing, the nightly graph job, automations'
# schedules), the outbox relay to Redis Streams, and the consumers of the
# platform's own events: the outbox desk's (`belt-publisher`) and the one that
# hands them to distribution and the automations waiting for them (`events`).
#
# SITES_DIR (default: this repository, whose sites/, packages/ and apps/ hold
# the zer0 sites — discovery finds them two levels down, e.g.
# /sites/sites/drsai) is mounted at /sites; register sites by their container
# path. Point it at a wider fleet checkout (SITES_DIR=~/github) to manage
# repositories that live outside this one.
# The image generator's profile mounts the same directory at the same path,
# so a site means the same checkout in both apps.
#
# Every port is published on 127.0.0.1 only.
#
# Every service carries the fleet's labels and log rotation (UPS-OPS-17), so
# the hub's log plane can pick it up by label; GIT_SHA and BUILT_AT reach the
# platform image from the environment (`GIT_SHA=$(git rev-parse --short HEAD)`).

x-fleet-logging: &fleet-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-fleet-labels: &fleet-labels
  com.bamr87.fleet.repo: bamr87/zer0-CMS
  com.bamr87.fleet.project: zer0-cms

x-content-build: &content-build
  context: .
  dockerfile: content/Dockerfile
  args:
    GIT_SHA: ${GIT_SHA:-unknown}
    BUILT_AT: ${BUILT_AT:-unknown}

services:
  # zer0-image-generator's web panel (full preview runs, compositions, the
  # studio), built from packages/zer0-image-generator in this monorepo. Its
  # Dockerfile's build context is that package's root (it loads the engine
  # from ../lib), so the context is the package and the Dockerfile is
  # web/Dockerfile.
  imagegen:
    profiles: ["imagegen"]
    build:
      context: ${ZER0_IMAGE_GENERATOR_DIR:-./packages/zer0-image-generator}
      dockerfile: web/Dockerfile
      target: development
    ports:
      - "127.0.0.1:${IMAGEGEN_PORT:-3000}:3000"
    volumes:
      - ${SITES_DIR:-.}:/sites
      - imagegen-storage:/app/web/storage
      - imagegen-forge:/app/.forge
    environment:
      RAILS_ENV: development
      BINDING: 0.0.0.0
      SOLID_QUEUE_IN_PUMA: "true"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      XAI_OAUTH_TOKEN: ${XAI_OAUTH_TOKEN:-}
      STABILITY_API_KEY: ${STABILITY_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
    labels:
      <<: *fleet-labels
      com.bamr87.fleet.stack: rails
      com.bamr87.fleet.log_format: text
    logging: *fleet-logging
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/up"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 60s

  # ── The platform (profile: content) ─────────────────────────────────────
  db:
    profiles: ["content"]
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: zer0
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zer0}
      POSTGRES_DB: zer0
    volumes:
      - pgdata:/var/lib/postgresql/data
    labels:
      <<: *fleet-labels
      com.bamr87.fleet.stack: postgres
      com.bamr87.fleet.log_format: text
    logging: *fleet-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zer0 -d zer0"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    profiles: ["content"]
    image: redis:7-alpine
    labels:
      <<: *fleet-labels
      com.bamr87.fleet.stack: redis
      com.bamr87.fleet.log_format: text
    logging: *fleet-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  content:
    profiles: ["content"]
    build: *content-build
    command: >-
      sh -c "python manage.py migrate --noinput &&
             python manage.py sync_agents --publish &&
             gunicorn config.wsgi:application"
    ports:
      - "127.0.0.1:${CONTENT_PORT:-8000}:8000"
    environment: &content-env
      DJANGO_SETTINGS_MODULE: config.settings.production
      SECRET_KEY: ${CONTENT_SECRET_KEY:-change-me-in-production}
      ALLOWED_HOSTS: localhost,127.0.0.1,content
      CSRF_TRUSTED_ORIGINS: http://localhost:${CONTENT_PORT:-8000},http://127.0.0.1:${CONTENT_PORT:-8000}
      SESSION_COOKIE_SECURE: "false"
      CSRF_COOKIE_SECURE: "false"
      DATABASE_URL: postgres://zer0:${POSTGRES_PASSWORD:-zer0}@db:5432/zer0
      REDIS_URL: redis://redis:6379/0
      # Tool rate limits are counted in the cache, so it has to be shared by
      # every worker and process.
      CACHE_URL: rediscache://redis:6379/1
      # Books are generated in packages/books/library/, outside the image.
      BOOKS_LIBRARY_DIR: /app/packages/books/library
      # recorded (fixtures, no network) unless a deployment opts into a model.
      LLM_BACKEND: ${LLM_BACKEND:-recorded}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MCP_ALLOWED_ORIGINS: http://localhost:${CONTENT_PORT:-8000}
      # The ops baseline (content/ops/README.md): JSON lines by default here,
      # browser origins that may call the APIs, error reporting when set.
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      # Sites (content/sites/README.md): checkouts may be registered from /sites;
      # the worker, which runs their sync and write-back jobs, mounts it writable.
      SITES_DIR: /sites
      # Distribution (content/distribution/README.md): the LinkedIn app lets a
      # person connect a channel (each publishes with its own token), and
      # nothing goes out to a kind unless its switch is 1 here and a person
      # armed the channel.
      LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:-}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:-}
      ZER0_CMS_LINKEDIN_REDIRECT_URI: ${ZER0_CMS_LINKEDIN_REDIRECT_URI:-}
      ZER0_LINKEDIN_PUBLISH: ${ZER0_LINKEDIN_PUBLISH:-}
      ZER0_WORDPRESS_PUBLISH: ${ZER0_WORDPRESS_PUBLISH:-}
      ZER0_GITHUB_PR_PUBLISH: ${ZER0_GITHUB_PR_PUBLISH:-}
      ZER0_EMAIL_PUBLISH: ${ZER0_EMAIL_PUBLISH:-}
    volumes:
      - ${SITES_DIR:-.}:/sites:ro
      - ./packages/books/library:/app/packages/books/library
      - content-media:/app/content/media
      # The outbox desk's belt and arenas (content/outboxdesk/README.md): read and sent on here, delivered and run in the
      # worker, published to by belt-publisher.
      - outbox-data:/app/content/var/outbox
    labels: &content-labels
      <<: *fleet-labels
      com.bamr87.fleet.stack: django
      com.bamr87.fleet.log_format: json
    logging: *fleet-logging
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/readyz"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 60s

  worker:
    profiles: ["content"]
    build: *content-build
    command: celery -A config worker --loglevel=INFO
    environment: *content-env
    volumes:
      - ${SITES_DIR:-.}:/sites
      - content-media:/app/content/media
      - outbox-data:/app/content/var/outbox
    labels: *content-labels
    logging: *fleet-logging
    depends_on:
      content: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping --timeout 5 -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # The research library's fetches — and automations' runs, whose webhooks and email wait too — wait on other people's
  # servers, so they have a queue of their own (CELERY_TASK_ROUTES in content/config/settings/base.py) that only this
  # worker consumes: a slow site holds it, never the worker that runs agents and publishes pages.
  research-worker:
    profiles: ["content"]
    build: *content-build
    command: celery -A config worker -Q research --hostname research@%h --concurrency 4 --loglevel=INFO
    environment: *content-env
    labels: *content-labels
    logging: *fleet-logging
    depends_on:
      content: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping --timeout 5 -d research@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  beat:
    profiles: ["content"]
    build: *content-build
    command: celery -A config beat --loglevel=INFO --schedule /tmp/celerybeat-schedule
    environment: *content-env
    labels: *content-labels
    logging: *fleet-logging
    depends_on:
      content: {condition: service_healthy}
    healthcheck:
      disable: true

  relay:
    profiles: ["content"]
    build: *content-build
    command: python manage.py relay_outbox
    environment: *content-env
    labels: *content-labels
    logging: *fleet-logging
    depends_on:
      content: {condition: service_healthy}
    healthcheck:
      disable: true

  # The outbox desk's publisher (content/outboxdesk/README.md): this plane's own stream, read through a consumer group
  # of its own, puts a `published` handoff on the outbox harness's belt for every page that goes live — from the
  # transactional outbox's event, never from the request that published the page.
  belt-publisher:
    profiles: ["content"]
    build: *content-build
    command: python manage.py consume_events --stream zer0:content --group outboxdesk --name outboxdesk-1
    environment: *content-env
    volumes:
      - outbox-data:/app/content/var/outbox
    labels: *content-labels
    logging: *fleet-logging
    depends_on:
      content: {condition: service_healthy}
    healthcheck:
      disable: true

  # The platform's own consumers of its own events (content/outbox/README.md), read back from the stream the relay
  # writes (EVENTS_STREAM) by a consumer group of its own: a page going live drafts a post for every channel of its site
  # that drafts automatically (distribution/consumers.py), and an event fires the automations waiting for it
  # (content/automations/README.md). Whichever process reads an event first runs every handler for it, once
  # (outbox/consumers.py), the outbox desk's included, so this one mounts the belt as belt-publisher does: a handoff
  # written anywhere else is lost. A draft post is keyed by the URL Jekyll gives its page, read from the site's
  # _config.yml, so it mounts the sites read-only as the content service does. Restarted if it stops: without it,
  # event automations are accepted and enabled but never fire.
  events:
    profiles: ["content"]
    build: *content-build
    command: python manage.py consume_events --own --group platform --name platform-1
    restart: unless-stopped
    environment: *content-env
    volumes:
      - ${SITES_DIR:-.}:/sites:ro
      - outbox-data:/app/content/var/outbox
    labels: *content-labels
    logging: *fleet-logging
    depends_on:
      content: {condition: service_healthy}
    healthcheck:
      disable: true

volumes:
  imagegen-storage:
  imagegen-forge:
  pgdata:
  content-media:
  outbox-data:
