# zer0-CMS — the fleet CMS (Rails on Administrate), the ABC wizard, and the
# content plane (Django + Wagtail, docs/adr/0001-target-architecture.md).
#
#   docker compose up --build                     # http://localhost:3001/admin
#   docker compose --profile imagegen up --build  # + zer0-image-generator on :3000
#   docker compose --profile content up -d --wait # + the content plane on :8000
#
# The content profile adds Postgres with pgvector, Redis, the Django app
# (/healthz, /admin/, /graphql/, /api/v2/, /mcp/), a Celery worker and beat
# (agent runs, the nightly graph job) and the outbox relay to Redis Streams.
# It is a profile, not the default, because the content plane is additive
# until PLAN-D1 is decided: the Rails CMS above needs none of it.
#
# SITES_DIR (default: this repository, whose sites/, packages/ and apps/ hold
# the zer0 sites — discovery finds them two levels down, e.g.
# /sites/sites/drsai) is mounted at /sites; register sites by their container
# path. Point it at a wider fleet checkout (SITES_DIR=~/github) to manage
# repositories that live outside this one.
# The image generator's profile mounts the same directory at the same path,
# so a site means the same checkout in both apps.
#
# Both ports are published on 127.0.0.1 only. Without ZER0_CMS_PASSWORD the
# CMS refuses any request whose TCP peer is not loopback, and it treats the
# container's default gateway as loopback (ZER0_CMS_TRUST_DOCKER_GATEWAY) only
# because the port is not reachable from anywhere else. Publish it on another
# interface only together with ZER0_CMS_PASSWORD.
#
# ABC export needs an explicit target: DRSAI_SITE_ROOT or the form field.
# There is deliberately no default under the /sites mount.

services:
  cms:
    build:
      context: ./rails
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${PORT:-3001}:3000"
    volumes:
      - ${SITES_DIR:-.}:/sites
      - storage:/app/storage
    environment:
      SITES_DIR: /sites
      ZER0_CMS_TRUST_DOCKER_GATEWAY: "1"
      ZER0_CMS_PASSWORD: ${ZER0_CMS_PASSWORD:-}
      ZER0_CMS_USER: ${ZER0_CMS_USER:-}
      ZER0_CMS_HOSTS: ${ZER0_CMS_HOSTS:-}
      ZER0_IMAGE_GENERATOR_URL: ${ZER0_IMAGE_GENERATOR_URL:-http://localhost:3000}
      DRSAI_SITE_ROOT: ${DRSAI_SITE_ROOT:-}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-}
      # The ABC wizard's Claude fallback for themes without a bundled lexicon.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      # LinkedIn distribution (docs/DISTRIBUTION.md). The app credentials let a
      # person connect a channel; LINKEDIN_ACCESS_TOKEN is the fallback token
      # when a site has none; nothing publishes unless ZER0_LINKEDIN_PUBLISH=1.
      LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:-}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:-}
      LINKEDIN_ACCESS_TOKEN: ${LINKEDIN_ACCESS_TOKEN:-}
      ZER0_LINKEDIN_PUBLISH: ${ZER0_LINKEDIN_PUBLISH:-}
      ZER0_CMS_LINKEDIN_REDIRECT_URI: ${ZER0_CMS_LINKEDIN_REDIRECT_URI:-}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/up"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 40s

  # zer0-image-generator's web panel (full preview runs, compositions, the
  # studio), built from packages/zer0-image-generator in this monorepo. Its
  # Dockerfile's build context is that package's root (it loads the engine
  # from ../lib), so the context is the package and the Dockerfile is
  # web/Dockerfile.
  imagegen:
    profiles: ["imagegen"]
    build:
      context: ${ZER0_IMAGE_GENERATOR_DIR:-./packages/zer0-image-generator}
      dockerfile: web/Dockerfile
      target: development
    ports:
      - "127.0.0.1:${IMAGEGEN_PORT:-3000}:3000"
    volumes:
      - ${SITES_DIR:-.}:/sites
      - imagegen-storage:/app/web/storage
      - imagegen-forge:/app/.forge
    environment:
      RAILS_ENV: development
      BINDING: 0.0.0.0
      SOLID_QUEUE_IN_PUMA: "true"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      XAI_OAUTH_TOKEN: ${XAI_OAUTH_TOKEN:-}
      STABILITY_API_KEY: ${STABILITY_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/up"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 60s

  # ── The content plane (profile: content) ────────────────────────────────
  db:
    profiles: ["content"]
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: zer0
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zer0}
      POSTGRES_DB: zer0
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zer0 -d zer0"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    profiles: ["content"]
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  content:
    profiles: ["content"]
    build:
      context: .
      dockerfile: content/Dockerfile
    command: >-
      sh -c "python manage.py migrate --noinput &&
             python manage.py sync_agents --publish &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --access-logfile -"
    ports:
      - "127.0.0.1:${CONTENT_PORT:-8000}:8000"
    environment: &content-env
      DJANGO_SETTINGS_MODULE: config.settings.production
      SECRET_KEY: ${CONTENT_SECRET_KEY:-change-me-in-production}
      ALLOWED_HOSTS: localhost,127.0.0.1,content
      CSRF_TRUSTED_ORIGINS: http://localhost:${CONTENT_PORT:-8000},http://127.0.0.1:${CONTENT_PORT:-8000}
      SESSION_COOKIE_SECURE: "false"
      CSRF_COOKIE_SECURE: "false"
      DATABASE_URL: postgres://zer0:${POSTGRES_PASSWORD:-zer0}@db:5432/zer0
      REDIS_URL: redis://redis:6379/0
      # recorded (fixtures, no network) unless a deployment opts into a model.
      LLM_BACKEND: ${LLM_BACKEND:-recorded}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MCP_ALLOWED_ORIGINS: http://localhost:${CONTENT_PORT:-8000}
    volumes:
      - ${SITES_DIR:-.}:/sites:ro
      - content-media:/app/content/media
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 60s

  worker:
    profiles: ["content"]
    build:
      context: .
      dockerfile: content/Dockerfile
    command: celery -A config worker --loglevel=INFO
    environment: *content-env
    volumes:
      - content-media:/app/content/media
    depends_on:
      content: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping --timeout 5 -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  beat:
    profiles: ["content"]
    build:
      context: .
      dockerfile: content/Dockerfile
    command: celery -A config beat --loglevel=INFO --schedule /tmp/celerybeat-schedule
    environment: *content-env
    depends_on:
      content: {condition: service_healthy}
    healthcheck:
      disable: true

  relay:
    profiles: ["content"]
    build:
      context: .
      dockerfile: content/Dockerfile
    command: python manage.py relay_outbox
    environment: *content-env
    depends_on:
      content: {condition: service_healthy}
    healthcheck:
      disable: true

volumes:
  storage:
  imagegen-storage:
  imagegen-forge:
  pgdata:
  content-media:
