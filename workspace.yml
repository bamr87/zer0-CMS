# The zer0 workspace: every project this repository holds, in one registry.
#
# This file is the single source of truth for what lives where, how each
# project is set up, checked, tested and built, what it publishes, and what it
# depends on inside the repository. `bin/zer0` reads it (list, run, affected,
# check, vendor), CI calls `bin/zer0` rather than restating commands, and
# `bin/zer0 check` fails when this file and the tree disagree — a directory
# nobody registered, a path that does not exist, a dependency on a name that is
# not here, or a vendored copy that drifted from its source.
#
# Schema (validated by tools/workspace/lib/zer0_workspace/manifest.rb):
#   projects.<name>:
#     path:        directory the project lives in, relative to the root
#     paths:       (optional) the globs it owns, when `path` is "." and the
#                  project shares the root with others; otherwise `path/**`
#     kind:        extension | rails | gem | python | site | app
#     stack:       the toolchains it needs (node, ruby, python, jekyll, docker)
#     summary:     one sentence
#     upstream:    the repository it was imported from (docs/MONOREPO.md)
#     depends_on:  names of projects in this file it builds against
#     publishes:   what it ships — vsix, gem:<name>, pypi:<name>, pages, azure
#     ci:          the root workflow that gates it, or `none` (with a reason)
#     site:        (optional) the Jekyll root, relative to `path`, of a zer0
#                  site — `bin/zer0 doctor` checks every project that has one
#                  against the zer0 stack with the CMS's own `zer0 doctor`
#     route:       (required when it publishes `pages`) the sub-path the one
#                  Pages deploy serves it at — "/" or "/name/" — or
#                  `none — <reason>` (ADR 0002 §4; checked by `bin/zer0 check`)
#     tasks.<task>: a command run from `path` — or {run:, cwd:, env:}
#       setup  installs dependencies (may use the network)
#       check  fast, offline, no installs beyond the language runtime
#       test   the full suite (assumes `setup` ran)
#       build  produces the project's artifact
#       pages  builds the site for its route: pages.yml runs it with
#              ZER0_PAGES_CONFIG (a config file setting url/baseurl),
#              ZER0_PAGES_DEST (where to write) and ZER0_PAGES_BASEURL
#
# vendored: byte-identical copies one project keeps of another's file. The
# copy is what ships (a Docker context or a stdlib-only library cannot reach
# outside its own directory); the source is the only place it is edited.
# `bin/zer0 vendor` lists them, `bin/zer0 vendor --write` re-copies, and
# `bin/zer0 check` fails on drift.

version: 1

projects:
  cms-extension:
    path: "."
    paths:
      - "src/**"
      - "media/**"
      - "schemas/**"
      - "package.json"
      - "package-lock.json"
      - "esbuild.js"
      - "eslint.config.mjs"
      - "tsconfig.json"
      - "test-runner.js"
      - ".vscode-test.mjs"
      - ".vscodeignore"
      - ".vsix-manifest.txt"
    kind: extension
    stack: [node]
    summary: The VS Code extension — front matter as controls, a dashboard, SEO insights and a governed publishing path.
    upstream: bamr87/zer0-CMS
    publishes: [vsix]
    ci: extension.yml
    tasks:
      setup: npm ci
      check: npm run compile
      test: npm test
      build: npx @vscode/vsce package --no-dependencies

  content:
    path: content
    paths:
      - "content/**"
      - "schemas/events/**"
      - "schemas/graphql/**"
      - "schemas/content/**"
      - "schemas/openapi/**"
    kind: app
    stack: [python, docker]
    summary: The platform — Django + Wagtail pages, the agent harness and its one tool registry, suggestions, the content graph, the outbox, GraphQL/REST/MCP over all of it, and the ops baseline (ADR 0001, ADR 0004).
    upstream: bamr87/zer0-CMS
    ci: content.yml
    tasks:
      setup: pip install -r requirements-dev.txt
      check: python3 -m pytest -q -m "not slow" && python3 manage.py makemigrations --check --dry-run
      test:
        run: python3 -m pytest -q && python3 manage.py makemigrations --check --dry-run && ruff check . && ruff format --check .
      build: docker build -f Dockerfile ..

  cms-rails:
    path: rails
    kind: rails
    stack: [ruby]
    summary: The fleet CMS — a Rails 8.1 app that indexes every registered site and writes edits back to the files, plus the stdlib-only zer0 library (catalog, doctor, ABC generator).
    upstream: bamr87/zer0-CMS
    depends_on: [zer0-image-generator]
    ci: rails-app.yml
    tasks:
      setup: bundle install
      check: bash bin/test-stdlib
      test: bin/rails test && bin/rails zeitwerk:check

  # The zer0-mistakes theme (jekyll-theme-zer0) is developed in its own
  # repository, bamr87/zer0-mistakes, with its Rails studio (ADR 0005); the
  # sites below consume it as the gem or remote_theme each one declares.
  zer0-image-generator:
    path: packages/zer0-image-generator
    kind: gem
    stack: [ruby, python]
    summary: AI preview and social-image generation for any Jekyll site — the jekyll preview-images gem, its Python engine, the byte-identical Ruby port and the web panel.
    upstream: bamr87/zer0-image-generator
    publishes: ["gem:zer0-image-generator"]
    ci: zer0-image-generator.yml
    tasks:
      setup: python3 -m pip install pyyaml
      check:
        run: for f in test/ruby/test_*.rb; do ruby -Ilib "$f" || exit 1; done
        env: {LANG: C.UTF-8, LC_ALL: C.UTF-8}
      test:
        run: python3 test/test_preview_generator.py && ruby test/test_command.rb && for f in test/ruby/test_*.rb; do ruby -Ilib "$f" || exit 1; done
        env: {LANG: C.UTF-8, LC_ALL: C.UTF-8}
      build: gem build zer0-image-generator.gemspec

  books:
    path: packages/books
    kind: python
    stack: [python]
    summary: A shelf of book projects (library/<slug>/) and the bookshelf app that validates, compiles and edits them, with a Claude-backed studio.
    upstream: bamr87/books
    ci: books.yml
    tasks:
      setup: pip install -e ".[dev]"
      check:
        run: python3 -m pytest -q
        env: {PYTHONPATH: src}
      test: python3 -m pytest -q && ruff check src tests

  "1987":
    path: sites/1987
    kind: site
    stack: [python]
    summary: The self-growing knowledge base about the year 1987 — plain-markdown topic pages by category, grown by Claude Code slash commands and published by GitHub Pages from the original repository.
    upstream: bamr87/1987
    publishes: [pages]
    route: none — a plain-markdown repository with no Jekyll config of its own; its GitHub Pages site went with the deleted bamr87/1987, and it gets a route once it has a _config.yml
    ci: ci.yml
    tasks:
      check: python3 ../../tools/unwrap-prose.py --check --exclude '(^|/)SCHEMA\.md$' --exclude '(^|/)CHANGELOG\.md$' . || true

  "2005":
    path: sites/2005
    kind: site
    stack: [ruby, jekyll]
    summary: The year-2005 knowledge base of the year-of-ai lineage — a remote_theme consumer of the zer0 theme, built the way zer0-pages-remote is.
    upstream: year-of-ai/2005
    publishes: [pages]
    route: none — published by year-of-ai.github.io at /2005/, which builds it from this repository (ADR 0002 §4)
    ci: sites.yml
    site: .
    tasks:
      setup: bundle install
      build: bundle exec jekyll build

  drsai:
    path: sites/drsai
    kind: site
    stack: [ruby, jekyll, python]
    summary: The children's picture-book site and its Python story engine; the CMS's ABC wizard exports into it.
    upstream: bamr87/drsai
    publishes: [pages, "pypi:drsai"]
    ci: drsai.yml
    site: "."
    route: /drsai/
    tasks:
      # The site builds with the published theme (remote_theme). To build against a
      # local theme checkout instead: ZER0_THEME_LOCAL=<path> bundle install &&
      # bundle exec jekyll build --config _config.yml,_config_dev.yml (drsai.yml does
      # that against bamr87/zer0-mistakes main).
      setup: bundle install && (cd drsai && pip install -e ".[dev]")
      check: python3 tools/import_abc_book.py --check
      test:
        run: (cd drsai && pytest tests/ -q) && python3 tools/import_abc_book.py --check
      build: bundle exec jekyll build
      pages: bundle exec jekyll build --config "_config.yml,$ZER0_PAGES_CONFIG" --destination "$ZER0_PAGES_DEST"

  zer0-pages:
    path: sites/zer0-pages
    kind: site
    stack: [ruby, jekyll]
    summary: One body of content for two consumers — an Obsidian vault and a Jekyll site — joined by a build-time bridge.
    upstream: bamr87/zer0-pages
    depends_on: [zer0-image-generator]
    publishes: [pages]
    ci: zer0-pages.yml
    site: "."
    route: /zer0-pages/
    tasks:
      setup: bundle install
      check: ruby -Ipages/_plugins tests/test_obsidian_bridge.rb && ruby -Ipages/_plugins tests/test_graph_index.rb && python3 tools/schema_lint.py check .
      build: bundle exec jekyll build
      pages: bundle exec jekyll build --config "_config.yml,$ZER0_PAGES_CONFIG" --destination "$ZER0_PAGES_DEST"

  zer0-pages-remote:
    path: sites/zer0-pages-remote
    kind: site
    stack: [ruby, jekyll]
    summary: The minimal remote_theme consumer — proof of how few files a working GitHub Pages site needs.
    upstream: bamr87/zer0-pages-remote
    publishes: [pages]
    ci: sites.yml
    site: "."
    route: /zer0-pages-remote/
    tasks:
      setup: bundle install
      build: bundle exec jekyll build
      pages: bundle exec jekyll build --config "_config.yml,$ZER0_PAGES_CONFIG" --destination "$ZER0_PAGES_DEST"

  zer0-demo-cookbook:
    path: sites/zer0-demo-cookbook
    kind: site
    stack: [ruby, jekyll]
    summary: A demo site generated by the theme's installer (cookbook profile).
    upstream: bamr87/zer0-demo-cookbook
    publishes: [pages]
    ci: sites.yml
    site: "."
    route: /demos/cookbook/
    tasks:
      setup: bundle install
      build: bundle exec jekyll build
      pages: bundle exec jekyll build --config "_config.yml,$ZER0_PAGES_CONFIG" --destination "$ZER0_PAGES_DEST"

  zer0-demo-garden:
    path: sites/zer0-demo-garden
    kind: site
    stack: [ruby, jekyll]
    summary: A demo site generated by the theme's installer (garden profile).
    upstream: bamr87/zer0-demo-garden
    publishes: [pages]
    ci: sites.yml
    site: "."
    route: /demos/garden/
    tasks:
      setup: bundle install
      build: bundle exec jekyll build
      pages: bundle exec jekyll build --config "_config.yml,$ZER0_PAGES_CONFIG" --destination "$ZER0_PAGES_DEST"

  irony-works:
    path: sites/irony-works
    kind: site
    stack: [node, jekyll]
    summary: The perpetual encyclopedia of irony — a self-growing, AI-tended Obsidian vault whose engine transplants entries into a Jekyll collection published with the zer0 theme.
    upstream: bamr87/irony-works
    publishes: [pages]
    route: none — it builds with GitHub Pages' own Jekyll (no Gemfile) after its node transplant step, and bamr87/irony-works still deploys it; it routes at /irony-works/ once it has a bundler-based pages task (C4)
    ci: irony-works.yml
    site: "."
    tasks:
      setup: npm i js-yaml --no-save
      check: for f in engine/scripts/*.mjs; do node --check "$f" || exit 1; done
      build: node engine/scripts/preview.mjs && node engine/scripts/transplant.mjs

  wargames:
    path: sites/wargames
    kind: site
    stack: [ruby, jekyll, python]
    summary: OverTheWire security wargames (Bandit, Natas and more) mirrored as a Jekyll study site with spoiler-free study guides — a remote_theme consumer of the zer0 theme.
    upstream: bamr87/wargames
    publishes: [pages]
    ci: sites.yml
    site: "."
    route: /wargames/
    tasks:
      setup: bundle install
      check: python3 ../../tools/unwrap-prose.py --check --exclude '(^|/)SCHEMA\.md$' --exclude '(^|/)CHANGELOG\.md$' .
      build: bundle exec jekyll build
      pages: bundle exec jekyll build --config "_config.yml,$ZER0_PAGES_CONFIG" --destination "$ZER0_PAGES_DEST"

  parodynews:
    path: apps/parodynews
    kind: app
    stack: [python, node, docker]
    summary: A Django 5.2 + React app that generates and manages parody news with a provider-agnostic AI layer, deployed to Azure Container Apps.
    upstream: bamr87/barodybroject
    publishes: [azure, pages]
    route: /parodynews/
    ci: parodynews.yml
    site: "src/pages"
    tasks:
      setup: pip install -r requirements-dev.txt && (cd src/pages && bundle install)
      check: ruff check src/ && black --check src/
      test:
        run: python -m pytest
        cwd: src
        env: {DJANGO_SETTINGS_MODULE: config.settings.testing}
      pages:
        run: bundle exec jekyll build --config "_config.yml,$ZER0_PAGES_CONFIG" --destination "$ZER0_PAGES_DEST"
        cwd: src/pages

  aieo:
    path: apps/aieo
    kind: app
    stack: [python, node, docker]
    summary: AI Engine Optimization — a FastAPI + React app that scores and rewrites website content so AI engines like ChatGPT and Claude will cite it.
    upstream: bamr87/aieo
    ci: aieo.yml
    tasks:
      setup: pip install -r backend/requirements.txt pytest pytest-cov && (cd frontend && npm ci)
      check: ruff check backend/
      test: (cd backend && pytest) && (cd frontend && npm run lint && npm test)
      build:
        run: npm run build
        cwd: frontend

vendored:
  - copy: rails/app/assets/stylesheets/zer0-tokens.css
    source: packages/zer0-image-generator/web/app/assets/stylesheets/zer0-tokens.css
    why: The fleet CMS is themed by the zer0-ui-tokens kit; rails/ is its own Docker build context.
  - copy: rails/lib/zer0_cms/data/abc_art_styles.yml
    source: packages/zer0-image-generator/lib/zer0_image_generator/abc/art_styles.yml
    why: The ABC wizard offers the image generator's art styles; rails/lib is stdlib-only and loads no gem.
  - copy: content/agents/data/abc_lexicons/it_systems.yml
    source: rails/lib/zer0_cms/abc/lexicons/it_systems.yml
    why: The content plane's ABC drafter generates the same offline books as the Rails wizard, from the same lexicon.
  # The hub-seeded one-paragraph-per-line fixer, tools/unwrap-prose.py, has one
  # copy: the root's, which markdown-oneline.yml runs over the whole repository
  # and every project calls as ../../tools/unwrap-prose.py.
  # rails/lib/zer0_cms/data/frontmatter_schema.yml is a copy of the theme's
  # .github/config/frontmatter_schema.yml, refreshed from bamr87/zer0-mistakes by
  # tag (its README records the commit) now that the theme lives there (ADR 0005).
