# Unit + integration CI. The engine is stdlib+PyYAML with zero-network tests;
# the integration job proves the gem end-to-end on a standard-layout fixture
# site with the free deterministic `local` provider (real PNGs via rsvg).
name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python-unit:
    name: Python unit (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pyyaml
      - run: python -m py_compile lib/zer0_image_generator/preview_generator.py
      - run: python test/test_preview_generator.py

  gem-build:
    name: Gem build + Ruby syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: |
          for f in lib/zer0-image-generator.rb lib/zer0_image_generator/*.rb; do
            ruby -c "$f"
          done
      - run: ruby test/test_command.rb
      - run: gem build zer0-image-generator.gemspec
      - name: Gem contains the engine + rasterizer helper
        run: |
          gem unpack zer0-image-generator-*.gem --target /tmp/unpacked
          test -f /tmp/unpacked/*/lib/zer0_image_generator/preview_generator.py
          test -f /tmp/unpacked/*/lib/zer0_image_generator/rasterize-svg.js

  integration:
    name: Fixture site (jekyll preview-images, local provider)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: test/fixture-site
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: test/fixture-site
      - name: Install a rasterizer + PyYAML for the local provider
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q librsvg2-bin
          python3 -m pip install pyyaml
      - name: List missing previews
        run: bundle exec jekyll preview-images --list-missing
      - name: Dry run
        run: bundle exec jekyll preview-images --dry-run --verbose
      - name: Dry run wrote nothing (flags really reached the engine)
        run: |
          test ! -e assets/images/previews
          git diff --exit-code -- _posts _docs
      - name: Generate (local provider, real PNGs)
        run: bundle exec jekyll preview-images --collection all --verbose
      - name: Assert images exist and front matter was wired
        run: |
          test -f assets/images/previews/hello-world.png
          test -f assets/images/previews/getting-started.png
          grep -q '^preview: /images/previews/hello-world.png$' _posts/2026-01-01-hello-world.md
          grep -q '^preview: /images/previews/getting-started.png$' _docs/getting-started.md
          ls *.bak _posts/*.bak _docs/*.bak 2>/dev/null && exit 1 || true
      - name: Second run is idempotent (skips existing)
        run: |
          out=$(bundle exec jekyll preview-images --collection all --verbose)
          echo "$out" | grep -q 'Files skipped: 2'
