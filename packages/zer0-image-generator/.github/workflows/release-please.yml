# Conventional Commits on main → release PR → tag on merge (same flow as
# zer0-mistakes). RubyGems publishing is a follow-up: add a publish job gated
# on the release output once a RUBYGEMS_API_KEY secret exists.
name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
