# fleet.manifest.yml — this repository's AI fleet, in the
# shared 'fleet/v1' vocabulary. See docs/FLEET-SPEC.md in
# bamr87/wtd. Generated by `wtd fleet adopt`; edit freely —
# hand-written values survive regeneration of other fields.
spec_version: fleet/v1
repo: bamr87/zer0-image-generator
provenance: derived
summary: The only AI lane is the @claude mention handler (claude.yml); the engine's Claude art-direction (analyze/review) runs locally via the CLI or in the Rails web app, not as a workflow.
lanes:
- id: claude
  kind: mention
  harness: claude-code-action
  implementation: .github/workflows/claude.yml
  description: Claude
  triggers:
  - kind: event
    events:
    - issue_comment
    - issues
    - pull_request_review
    - pull_request_review_comment
  switch: null
  uses_tokens:
  - ANTHROPIC_API_KEY
  - CLAUDE_CODE_OAUTH_TOKEN
  guardrails:
    never_merges: true
    opens_pull_requests: false
tokens:
- name: ANTHROPIC_API_KEY
  scope: fleet
  required: false
  purpose: Fallback Claude auth, used only when the OAuth token is absent.
  used_by:
  - claude
- name: CLAUDE_CODE_OAUTH_TOKEN
  scope: fleet
  required: true
  purpose: 'Preferred Claude auth (house convention: OAuth first). Produced by 
`claude setup-token`.'
  used_by:
  - claude
agents:
- svg-critic
skills:
- run-zer0-image-generator
- svg-art

