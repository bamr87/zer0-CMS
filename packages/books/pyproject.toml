[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bookshelf"
version = "0.1.0"
description = "Manage a shelf of book ideas and their contents."
readme = "README.md"
requires-python = ">=3.10"
# No `license` field on purpose. This repository holds both code and original
# fiction, and those want different terms; the owner has not chosen either yet.
keywords = ["writing", "manuscript", "markdown", "outline"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Markup :: Markdown",
]

# Intentionally empty. The library is plain markdown and YAML, and bookshelf
# parses the documented front matter subset with the standard library, so
# `books validate` and `books studio` work in a bare checkout. PyYAML is used
# automatically when installed; the assistant needs the `ai` extra.
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]
# Only `books ask` and the studio's Assist panel need this. Everything else --
# including the editor itself -- runs without it.
ai = ["anthropic>=0.69"]
dev = ["PyYAML>=6.0", "anthropic>=0.69", "pytest>=7.0", "ruff>=0.5"]

[project.scripts]
books = "bookshelf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
