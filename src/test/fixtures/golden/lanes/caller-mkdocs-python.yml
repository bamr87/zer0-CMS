# kit: ai-runner v0.1.0 — a caller of the fleet's reusable AI lane.
# Copy per lane; fill the four __PLACEHOLDERS__; keep the rest.
# Docs: https://github.com/bamr87/bamr87/tree/main/templates/ai-runner
name: docs-audit

on:
  schedule:
    - cron: "41 6 * * 1"          # pick an odd minute; never :00
  workflow_dispatch:              # a human can always run it by hand (bypasses the switch)

# Least privilege lives HERE: the reusable lane inherits exactly these.
permissions:
  contents: write
  pull-requests: write

jobs:
  lane:
    uses: bamr87/bamr87/.github/workflows/ai-lane.yml@main
    with:
      lane: docs-audit
      switch: DOCS_AUDIT_ENABLED     # repo VARIABLE; the lane idles until it is "true"
      agent: docs-auditor               # .claude/agents/docs-auditor.md owns the role
      prompt: "Audit the documentation under docs/ against the code it describes. Fix only what you can verify is wrong — a page that is merely old is not a finding. Run `mkdocs build --strict` before opening anything, open ONE pull request, write its URL to pr-result.txt, and STOP. Never merge."
      tools: "Bash,Read,Edit,Grep,Glob"
      system: "You are the documentation auditor for the handbook. Verify before you claim. Never merge."
      setup-python: "3.12"
      pre-run: |
        pip install -r requirements.txt
        mkdocs build --strict
      result-file: pr-result.txt
      timeout-minutes: 25
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GH_PAT: ${{ secrets.FLEET_TOKEN }}
