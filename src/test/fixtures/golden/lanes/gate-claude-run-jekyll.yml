# kit: ai-runner v0.1.0 — a hand-written gate plus the fleet's claude-run composite.
# Generated by zer0-CMS from a lane spec. The reusable ai-lane.yml could not
# express this lane, so its gate is written out here in the same words.
# Docs: https://github.com/bamr87/bamr87/tree/main/templates/ai-runner
#
# Produce ONE on-voice, tested piece from the backlog, verify it with the
# repository harness, and open ONE pull request. Never merges.
name: content-factory

on:
  schedule:
    - cron: "17 9 * * *"          # an odd minute; never :00
  workflow_dispatch:              # a human can always run it by hand (bypasses the switch)

# Least privilege lives HERE, at the top level, so both jobs inherit exactly these.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: content-factory
  cancel-in-progress: false

jobs:
  # The kill switch and "is there a credential at all?" — the same two
  # questions the hub's reusable lane asks, in the same order.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        env:
          ENABLED: ${{ vars.CONTENT_FACTORY_ENABLED }}
          EVENT: ${{ github.event_name }}
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          go=true; why="enabled"
          if [ "$EVENT" != "workflow_dispatch" ] && [ "$ENABLED" != "true" ]; then
            go=false; why="repo variable CONTENT_FACTORY_ENABLED is not 'true' (set it to enable; workflow_dispatch bypasses)"
          elif [ -z "$OAUTH" ] && [ -z "$KEY" ]; then
            go=false; why="no Claude credential (CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY)"
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"
          [ "$go" = "true" ] || echo "::notice::content-factory idle: $why"

  run:
    needs: gate
    if: ${{ needs.gate.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # One leg failing never kills its siblings…
      fail-fast: false
      # …and one at a time, because parallel agents race each
      # other's 'is there already an open PR for this?' check.
      max-parallel: 1
      matrix:
        item: [hack, tool, post, doc, wire]
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      AI_ROLE: grow-lifehacker
      AI_LANE: content-factory
    steps:
      # NOT `${{ secrets.FLEET_TOKEN || github.token }}`: a PAT that is present
      # but expired wins that `||` and then fails at push time as `could not
      # read Username`, and an absent one degrades silently to a token GitHub
      # forbids from opening a pull request. Probe it, then export the winner.
      - name: Resolve the GitHub token (probe FLEET_TOKEN, else the job token)
        env:
          PAT: ${{ secrets.FLEET_TOKEN }}
          JOB_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$PAT" ] && GH_TOKEN="$PAT" gh api user -q .login >/dev/null 2>&1; then
            echo "GH_TOKEN=$PAT" >> "$GITHUB_ENV"
          else
            [ -z "$PAT" ] || echo "::warning::FLEET_TOKEN did not validate — using the job token (PRs it opens will not trigger CI)."
            echo "GH_TOKEN=$JOB_TOKEN" >> "$GITHUB_ENV"
          fi

      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      # NOT continue-on-error by default: a crashed agent must show RED, not a
      # silent green skip that nobody reads.
      - name: Agent — grow-lifehacker (universal AI runner)
        id: agent
        uses: bamr87/bamr87/.github/actions/claude-run@main
        with:
          agent: grow-lifehacker
          prompt: "Use the grow-lifehacker skill to produce exactly ONE ${{ matrix.item }} for lifehacker.dev. Pick the highest-priority backlog item whose kind IS '${{ matrix.item }}' — never borrow an item meant for another collection. If every candidate duplicates an open pull request, propose a fresh on-voice ${{ matrix.item }} idea, add it to the backlog, and draft that — never silently no-op, never cross collections. Verify with the repository's own harness before opening anything. Open ONE pull request, label it 'auto:content' and 'collection/${{ matrix.item }}', write the resulting PR URL to pr-result.txt, flip the backlog item to done, and STOP. Never merge."
          tools: "Bash,Read,Write,Edit,Grep,Glob"
          system: "You are the lifehacker.dev content factory. Produce one on-voice, tested piece and open one pull request. Never merge."

      # Reached only when the agent step SUCCEEDED, so an empty result file
      # means what it says: the agent ran and produced nothing.
      - name: Confirm the agent produced something (fail visibly if it did not)
        run: |
          [ -s pr-result.txt ] || { echo "::error::content-factory: the agent ran but wrote no pr-result.txt."; exit 1; }
          echo "result: $(cat pr-result.txt)"
