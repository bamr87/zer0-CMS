# kit: ai-runner v0.1.0 — a caller of the fleet's reusable AI lane.
# Copy per lane; fill the four __PLACEHOLDERS__; keep the rest.
# Docs: https://github.com/bamr87/bamr87/tree/main/templates/ai-runner
name: content-factory

on:
  schedule:
    - cron: "17 9 * * *"          # pick an odd minute; never :00
  workflow_dispatch:              # a human can always run it by hand (bypasses the switch)

# Least privilege lives HERE: the reusable lane inherits exactly these.
permissions:
  contents: write
  pull-requests: write

jobs:
  lane:
    uses: bamr87/bamr87/.github/workflows/ai-lane.yml@main
    with:
      lane: content-factory
      switch: CONTENT_FACTORY_ENABLED     # repo VARIABLE; the lane idles until it is "true"
      agent: grow-lifehacker               # .claude/agents/grow-lifehacker.md owns the role
      prompt: "Use the grow-lifehacker skill to produce exactly ONE piece for lifehacker.dev. Pick the highest-priority backlog item whose kind matches the assignment; if every candidate duplicates an open pull request, propose a fresh on-voice idea, add it to the backlog, and draft that — never silently no-op. Verify with the repository's own harness before opening anything. Open ONE pull request on a branch, label it 'auto:content', write the resulting PR URL to pr-result.txt, flip the backlog item to done, and STOP. Never merge."
      tools: "Bash,Read,Write,Edit,Grep,Glob"
      system: "You are the lifehacker.dev content factory. Produce one on-voice, tested piece and open one pull request. Never merge."
      setup-ruby: "3.3"
      result-file: pr-result.txt
      timeout-minutes: 20
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GH_PAT: ${{ secrets.FLEET_TOKEN }}
