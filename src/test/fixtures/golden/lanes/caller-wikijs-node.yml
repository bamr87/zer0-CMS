# kit: ai-runner v0.1.0 — a caller of the fleet's reusable AI lane.
# Copy per lane; fill the four __PLACEHOLDERS__; keep the rest.
# Docs: https://github.com/bamr87/bamr87/tree/main/templates/ai-runner
name: content-review

on:
  workflow_dispatch:              # a human can always run it by hand (bypasses the switch)
  pull_request:

# Least privilege lives HERE: the reusable lane inherits exactly these.
permissions:
  contents: write
  pull-requests: write

jobs:
  lane:
    uses: bamr87/bamr87/.github/workflows/ai-lane.yml@main
    with:
      lane: content-review
      switch: CONTENT_REVIEW_ENABLED     # repo VARIABLE; the lane idles until it is "true"
      agent: content-reviewer               # .claude/agents/content-reviewer.md owns the role
      prompt: "Review the changed pages on this pull request. Apply small improvements to the changed content files ONLY; if it already reads clean, make no commit and post a one-line comment instead. This is a single editorial pass, not an iterative polish. Post larger follow-ups as comments. Write what you did to review-result.txt. Never touch infrastructure. Never merge."
      tools: "Bash(gh pr comment:*),Bash(git:*),Read,Edit,Write(pages/**),Grep,Glob"
      system: "You are the content reviewer for the wiki. Improve the changed content only; never merge."
      setup-node: "20"
      post-run: "node scripts/verify-links.mjs"
      result-file: review-result.txt
      timeout-minutes: 15
      cancel-in-progress: true
      continue-on-error: true
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GH_PAT: ${{ secrets.FLEET_TOKEN }}
