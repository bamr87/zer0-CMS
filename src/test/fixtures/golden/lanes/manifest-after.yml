# fleet.manifest.yml — this repository's AI fleet, in the
# shared 'fleet/v1' vocabulary. See docs/FLEET-SPEC.md in
# bamr87/wtd. Generated by `wtd fleet adopt`; edit freely —
# hand-written values survive regeneration of other fields.
spec_version: fleet/v1
repo: bamr87/example.dev
provenance: derived
summary: Two lanes and a token contract, both default-OFF behind their own *_ENABLED
  repo variable.
lanes:
- id: agent-review
  kind: review
  harness: claude-cli
  implementation: .github/workflows/agent-review.yml
  description: agent-review
  triggers:
  - kind: schedule
    cron: 17 5 1 * *
  - kind: dispatch
  switch: AGENT_REVIEW_ENABLED
  uses_tokens:
  - CLAUDE_CODE_OAUTH_TOKEN
  guardrails:
    never_merges: true
- id: triage
  kind: maintenance
  harness: none
  implementation: .github/workflows/triage.yml
  description: triage
  triggers:
  - kind: dispatch
  switch: null
  uses_tokens: []
  guardrails:
    never_merges: true
- id: content-factory
  kind: content
  harness: claude-cli
  implementation: .github/workflows/content-factory.yml
  description: "Produce ONE on-voice, tested piece from the backlog, verify it with the repository harness, and open ONE pull request. Never merges."
  triggers:
  - kind: schedule
    cron: "17 9 * * *"
  - kind: dispatch
  switch: CONTENT_FACTORY_ENABLED
  uses_tokens:
  - ANTHROPIC_API_KEY
  - CLAUDE_CODE_OAUTH_TOKEN
  - FLEET_TOKEN
  guardrails:
    never_merges: true
    opens_pull_requests: true

# The token contract. Every name here is a repository secret a human created.
tokens:
- name: CLAUDE_CODE_OAUTH_TOKEN
  scope: fleet
  required: true
  purpose: "Preferred Claude auth (house convention: OAuth first)."
  used_by:
  - agent-review
