# The three sites under sites/ that build with the Jekyll-theme option and no
# workflow of their own — zer0-pages-remote and the two installer demos — each
# built the way its own repository published it: with its own url and baseurl,
# by its `build` task (tools/jekyll_theme.py), which renders it with the zer0
# theme at the tag its `render:` setting pins and builds it with that setting's
# Jekyll server in Docker (PLAN P2). No Ruby is installed. One matrix leg per
# site, each only when its own tree changes, and every site when what builds
# them does: workspace.yml (each site's `render:` setting and tasks), the
# workspace tool that reads it, the option and its server. Each of the three is
# routed, so pages.yml compares its build with its recording
# (web/site/fixtures/, PLAN P1); nothing is compared here. 2005 and wargames
# built here too, 2005 against its recording, until they moved to
# lifehacker.dev's agencies (ADR 0012).
name: sites

on:
  push:
    branches: [main]
    paths:
      - "sites/zer0-pages-remote/**"
      - "sites/zer0-demo-cookbook/**"
      - "sites/zer0-demo-garden/**"
      - "workspace.yml"
      - "bin/zer0"
      - "tools/workspace/**"
      - "tools/jekyll_theme.py"
      - "tools/jekyll/**"
      - "tools/obsidian/**"
      - ".github/workflows/sites.yml"
  pull_request:
    paths:
      - "sites/zer0-pages-remote/**"
      - "sites/zer0-demo-cookbook/**"
      - "sites/zer0-demo-garden/**"
      - "workspace.yml"
      - "bin/zer0"
      - "tools/workspace/**"
      - "tools/jekyll_theme.py"
      - "tools/jekyll/**"
      - "tools/obsidian/**"
      - ".github/workflows/sites.yml"

permissions:
  contents: read

concurrency:
  group: sites-${{ github.ref }}
  cancel-in-progress: true

env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  TZ: UTC

jobs:
  plan:
    name: Which sites changed
    runs-on: ubuntu-latest
    outputs:
      sites: ${{ steps.plan.outputs.sites }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --quiet pyyaml
      - id: plan
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          all='["zer0-pages-remote","zer0-demo-cookbook","zer0-demo-garden"]'
          # Every site when there is nothing to diff against, or when what builds them changed — workspace.yml
          # (a site's render: setting, its theme tag, server or before: step), the workspace tool, the option, its
          # server, this workflow; otherwise the sites the change affects.
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null || ! git diff --quiet "$BASE" HEAD -- workspace.yml bin/zer0 tools/workspace tools/jekyll_theme.py tools/jekyll tools/obsidian .github/workflows/sites.yml; then
            changed="$all"
          else
            changed=$(bin/zer0 affected --base "$BASE" --json | python -c 'import json, sys; print(json.dumps(json.load(sys.stdin)["affected"]))')
          fi
          # Each leg names its site's Jekyll server, so only the jekyll-4 legs build that image.
          sites=$(bin/zer0 list --json | python -c '
          import json, sys
          wanted = set(json.loads(sys.argv[1])) & set(json.loads(sys.argv[2]))
          legs = [{"name": p["name"], "server": p["render"]["server"]} for p in json.load(sys.stdin) if p["name"] in wanted]
          print(json.dumps(legs, separators=(",", ":")))' "$all" "$changed")
          echo "sites=$sites" >> "$GITHUB_OUTPUT"

  build:
    name: jekyll build (${{ matrix.site.name }})
    needs: plan
    if: needs.plan.outputs.sites != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        site: ${{ fromJSON(needs.plan.outputs.sites) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --quiet pyyaml
      - name: The jekyll-4 server's image tag
        id: image
        if: matrix.site.server == 'jekyll-4'
        run: echo "tag=$(python tools/jekyll_theme.py image jekyll-4)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
        if: matrix.site.server == 'jekyll-4'
      - uses: docker/build-push-action@v7
        if: matrix.site.server == 'jekyll-4'
        with:
          context: tools/jekyll
          load: true
          tags: ${{ steps.image.outputs.tag }}
          cache-from: type=gha,scope=jekyll-4
          cache-to: type=gha,scope=jekyll-4,mode=max
      - name: Build with the Jekyll-theme option
        env:
          NAME: ${{ matrix.site.name }}
          ZER0_PAGES_DEST: ${{ runner.temp }}/site
          PAGES_REPO_NWO: ${{ github.repository }}
        run: |
          bin/zer0 run build "$NAME"
          test -f "$ZER0_PAGES_DEST/index.html" || { echo "::error::$NAME built no index.html"; exit 1; }
