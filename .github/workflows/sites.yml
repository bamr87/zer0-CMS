# The three remote_theme sites under sites/ — zer0-pages-remote and the two
# installer demos — built the way the hub's standard-ci built them in their
# own repositories: `bundle install` and `bundle exec jekyll build`, one matrix
# leg per site, each only when its own tree changes. They load the theme from
# GitHub (`remote_theme: bamr87/zer0-mistakes`), not from packages/, so a
# theme pull request does not rebuild them; drsai.yml is the gate that builds
# a site against the in-repo theme.
name: sites

on:
  push:
    branches: [main]
    paths:
      - "sites/zer0-pages-remote/**"
      - "sites/zer0-demo-cookbook/**"
      - "sites/zer0-demo-garden/**"
      - ".github/workflows/sites.yml"
  pull_request:
    paths:
      - "sites/zer0-pages-remote/**"
      - "sites/zer0-demo-cookbook/**"
      - "sites/zer0-demo-garden/**"
      - ".github/workflows/sites.yml"

permissions:
  contents: read

concurrency:
  group: sites-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Which sites changed
    runs-on: ubuntu-latest
    outputs:
      sites: ${{ steps.plan.outputs.sites }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - id: plan
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          all='["zer0-pages-remote","zer0-demo-cookbook","zer0-demo-garden"]'
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "sites=$all" >> "$GITHUB_OUTPUT"; exit 0
          fi
          affected=$(bin/zer0 affected --base "$BASE" --json)
          sites=$(ruby -rjson -e 'puts JSON.generate(JSON.parse(ARGV[0]) & JSON.parse(ARGV[1])["affected"])' "$all" "$affected")
          echo "sites=$sites" >> "$GITHUB_OUTPUT"

  build:
    name: jekyll build (${{ matrix.site }})
    needs: plan
    if: needs.plan.outputs.sites != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        site: ${{ fromJSON(needs.plan.outputs.sites) }}
    defaults:
      run:
        working-directory: sites/${{ matrix.site }}
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: sites/${{ matrix.site }}
      - run: bundle exec jekyll build
