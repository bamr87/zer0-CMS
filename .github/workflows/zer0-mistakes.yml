# packages/zer0-mistakes — the theme's pull-request gate, ported from the
# Quality Control, Test Suite and Build & Validate jobs of its own ci.yml.
#
# The theme's composite actions (.github/actions/*) resolve from the
# repository root and call each other by root-relative paths, so they cannot
# run from packages/zer0-mistakes/; their steps are inlined here instead, with
# every job running inside the package. Not ported yet (see docs/MONOREPO.md):
# the Docker integration job, the 9-skin visual-snapshot job and the theme's
# other 28 workflows (nightly, release, Pages, autopilot, translation …).
name: zer0-mistakes

on:
  push:
    branches: [main]
    paths: ["packages/zer0-mistakes/**", ".github/workflows/zer0-mistakes.yml"]
  pull_request:
    paths: ["packages/zer0-mistakes/**", ".github/workflows/zer0-mistakes.yml"]

permissions:
  contents: read

concurrency:
  group: zer0-mistakes-${{ github.ref }}
  cancel-in-progress: true

env:
  RUBY_VERSION: "3.3"
  NODE_VERSION: "20"
  # jekyll-github-metadata resolves the site's repository from this; the
  # theme's docs site is still published from bamr87/zer0-mistakes.
  PAGES_REPO_NWO: bamr87/zer0-mistakes

defaults:
  run:
    shell: bash
    working-directory: packages/zer0-mistakes

jobs:
  quality:
    name: Quality Control
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Version ↔ Gemfile.lock consistency
        run: |
          rb=$(sed -nE 's/.*VERSION = "([0-9][^"]*)".*/\1/p' lib/jekyll-theme-zer0/version.rb | head -1)
          lock=$(sed -nE 's/^[[:space:]]*jekyll-theme-zer0 \(([^)]+)\).*/\1/p' Gemfile.lock | head -1)
          [ -n "$rb" ] && [ -n "$lock" ] || { echo "::error::could not parse version (version.rb='$rb', Gemfile.lock='$lock')"; exit 1; }
          [ "$rb" = "$lock" ] || { echo "::error::version.rb ($rb) != Gemfile.lock ($lock) — run 'bundle lock' to re-sync"; exit 1; }
          echo "✓ version.rb and Gemfile.lock agree: $rb"

      - name: Version ↔ theme manifest consistency
        run: |
          rb=$(sed -nE 's/.*VERSION = "([0-9][^"]*)".*/\1/p' lib/jekyll-theme-zer0/version.rb | head -1)
          man=$(sed -nE 's/^version: "([^"]+)".*/\1/p' _data/theme-manifest.yml | head -1)
          [ -n "$rb" ] && [ -n "$man" ] || { echo "::error::could not parse version (version.rb='$rb', manifest='$man')"; exit 1; }
          [ "$rb" = "$man" ] || { echo "::error::version.rb ($rb) != manifest ($man) — run ./scripts/bin/manifest and commit"; exit 1; }
          echo "✓ version.rb and theme-manifest.yml agree: $rb"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          # Not bundler-cache: the theme is a path gem whose gemspec derives its
          # files from `git ls-files`, which frozen mode rejects (see the theme's
          # .github/actions/setup-ruby). Install non-frozen instead.
          bundler-cache: false

      - name: Install Ruby dependencies (non-frozen)
        run: |
          bundle config set --local path vendor/bundle
          bundle config set --local frozen false
          bundle install --jobs 4 --retry 3

      - name: Quality checks
        run: ./test/test_quality.sh

      - name: Markdown formatting
        run: ./scripts/fix-markdown-format.sh --dry-run

      - name: Quick preflight validation
        run: ./scripts/bin/validate --quick

  test:
    name: Test Suite (Ruby 3.3)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: false

      - name: Install Ruby dependencies (non-frozen)
        run: |
          bundle config set --local path vendor/bundle
          bundle config set --local frozen false
          bundle install --jobs 4 --retry 3

      - name: Theme suites (core, quality, obsidian, features)
        run: ./scripts/bin/test --verbose --skip-docker --skip-remote --suites core,quality,obsidian,features

      - name: Script suites (lib, theme validate, integration, installer e2e)
        run: ./scripts/bin/test

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: packages/zer0-mistakes/package-lock.json

      - name: Install Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Playwright critical tier (PR gate)
        env:
          PLAYWRIGHT_PROJECT: critical
          PLAYWRIGHT_WORKERS: "3"
          SKIP_NPM_INSTALL: "1"
          SKIP_PLAYWRIGHT_INSTALL: "1"
        run: ./test/test_playwright.sh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zer0-mistakes-test-results
          path: |
            packages/zer0-mistakes/test/results/
            packages/zer0-mistakes/test/visual-results/
          retention-days: 7
          if-no-files-found: ignore

  gem:
    name: Build & Validate the gem
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: false

      - name: Install Ruby dependencies (non-frozen)
        run: |
          bundle config set --local path vendor/bundle
          bundle config set --local frozen false
          bundle install --jobs 4 --retry 3

      - name: Build
        run: ./scripts/build

      - name: Validate and install the built gem
        run: |
          VERSION=$(ruby -e "require './lib/jekyll-theme-zer0/version'; puts JekyllThemeZer0::VERSION")
          GEM_FILE="jekyll-theme-zer0-${VERSION}.gem"
          test -f "$GEM_FILE" || { echo "::error::$GEM_FILE was not built"; ls -la ./*.gem 2>/dev/null; exit 1; }
          gem spec "$GEM_FILE" | grep -E "(name|version)" | head -3
          gem install "./$GEM_FILE" --local --no-document --ignore-dependencies
