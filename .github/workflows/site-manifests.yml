# site-manifests — rebuild every routed site the way pages.yml builds it and record what it
# wrote (PLAN P1, ADR 0006 decision 4): every output path with its media type, each page's
# title and a digest of its main text, the feed entries, the sitemap URLs and the redirects
# (tools/site_manifest.py; web/site/fixtures/README.md explains the recordings).
#
# A site moves to the Jekyll-theme option (P2) or the React renderer (P7) only when its new
# build reproduces its recorded manifest, so the recordings are the parity baseline — and a
# baseline a machine rewrites is no baseline. This workflow therefore commits nothing: it
# uploads the fresh manifests as an artifact (unzip it over web/site/fixtures/ to re-record),
# and with `check` it fails when one differs from the committed recording.
#
# Dispatch-only: it builds every site with the network (gems, remote themes), which is too
# slow for every pull request and is not what a pull request changes.
name: site-manifests

on:
  workflow_dispatch:
    inputs:
      check:
        description: Fail when a rebuilt manifest differs from the committed one
        type: boolean
        default: false
      site:
        description: Only this routed site (a workspace.yml project name); empty for all
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: site-manifests-${{ github.ref }}
  cancel-in-progress: true

env:
  # The theme's SCSS has multibyte characters; a non-UTF-8 locale breaks the Sass converter.
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      routes: ${{ steps.routes.outputs.routes }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - id: routes
        env:
          SITE: ${{ inputs.site }}
        run: |
          set -euo pipefail
          routes=$(bin/zer0 routes --json | jq -c --arg site "$SITE" 'map(select($site == "" or .name == $site))')
          test "$routes" != "[]" || { echo "::error::no routed site is named '$SITE' (bin/zer0 routes)"; exit 1; }
          echo "routes=$routes" >> "$GITHUB_OUTPUT"

  record:
    name: record ${{ matrix.site.route }} (${{ matrix.site.name }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        site: ${{ fromJSON(needs.plan.outputs.routes) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ${{ matrix.site.bundle_dir }}
      # The interpreter the committed recordings were written with, so an HTML parser fix in
      # another release cannot pass for a site change.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Rebuild and record
        env:
          NAME: ${{ matrix.site.name }}
        run: python3 tools/site_manifest.py --write --site "$NAME" --fixtures "$RUNNER_TEMP/fixtures"
      - uses: actions/upload-artifact@v7
        with:
          name: site-manifest-${{ matrix.site.name }}
          path: ${{ runner.temp }}/fixtures
          retention-days: 30
      - name: Compare with the committed recording
        if: inputs.check
        env:
          NAME: ${{ matrix.site.name }}
        run: python3 tools/site_manifest.py compare "web/site/fixtures/$NAME/manifest.json" "$RUNNER_TEMP/fixtures/$NAME/manifest.json"

  collect:
    needs: record
    if: always() && needs.record.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: site-manifest-*
          merge-multiple: true
          path: fixtures
      - uses: actions/upload-artifact@v7
        with:
          name: site-manifests
          path: fixtures
          retention-days: 30
