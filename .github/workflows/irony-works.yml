# sites/irony-works — the perpetual encyclopedia of irony. Its own repository
# gated pull requests with the hub's standard-ci alone; the real proof the site
# works is the build half of its publish.yml, so that is the gate here, through
# the Jekyll-theme option (PLAN P2): the site's `build` task (tools/jekyll_theme.py)
# exports the site, runs its `before:` step there — render the previews,
# transplant the vault into the _entries/ collection — and builds it with the
# zer0 theme at its pinned tag and GitHub Pages' own builder (the image
# actions/jekyll-build-pages runs), so no Ruby is installed. The build is then
# compared with the recording of it (web/site/fixtures/irony-works/, PLAN P1);
# a difference warns, as it does in pages.yml. Nothing is deployed —
# bamr87/irony-works still publishes the live site. Not ported (see
# docs/MONOREPO.md): the deploy, the advisory Alanis Gate on vault pull requests
# and the scheduled Germinate loop, all still under
# sites/irony-works/.github/workflows/ as reference.
name: irony-works

on:
  push:
    branches: [main]
    paths: ["sites/irony-works/**", "tools/jekyll_theme.py", "web/site/fixtures/irony-works/**", ".github/workflows/irony-works.yml"]
  pull_request:
    paths: ["sites/irony-works/**", "tools/jekyll_theme.py", "web/site/fixtures/irony-works/**", ".github/workflows/irony-works.yml"]

permissions:
  contents: read

concurrency:
  group: irony-works-${{ github.ref }}
  cancel-in-progress: true

env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  TZ: UTC

jobs:
  build:
    name: Render, transplant and jekyll build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --quiet pyyaml
      - name: Build with the Jekyll-theme option
        env:
          ZER0_PAGES_DEST: ${{ runner.temp }}/site
          ZER0_PAGES_BUILT_WITH: ${{ runner.temp }}/built-with.json
        run: |
          bin/zer0 run build irony-works
          test -f "$ZER0_PAGES_DEST/index.html" || { echo "::error::irony-works built no index.html"; exit 1; }
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Compare with the recorded build
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 tools/site_manifest.py build "$RUNNER_TEMP/site" --site irony-works --built-with "$RUNNER_TEMP/built-with.json" --out "$RUNNER_TEMP/manifest.json"
          status=0
          python3 tools/site_manifest.py compare web/site/fixtures/irony-works/manifest.json "$RUNNER_TEMP/manifest.json" | tee "$RUNNER_TEMP/compare.txt" || status=$?
          if [ "$status" -ne 0 ]; then
            { echo "### irony-works differs from its recording"; echo '```'; head -n 200 "$RUNNER_TEMP/compare.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::irony-works's build differs from web/site/fixtures/irony-works/manifest.json (the job summary says how)"
          fi
