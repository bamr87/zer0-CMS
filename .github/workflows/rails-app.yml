# The Rails app half of rails/: the fleet CMS on Administrate, gated on its
# own terms.
#
# `abc-engine.yml` proves the stdlib library under rails/lib without bundler.
# This workflow is the other half, and it is allowed a bundle: the Rails
# integration tests (test/integration, test/services), Zeitwerk's eager-load
# check, and a production boot that must answer /up and /admin — the same
# RAILS_ENV and asset pipeline the Docker image runs.
#
# python3 + PyYAML are installed so the image-engine tests exercise the locked
# zer0-image-generator gem's Python engine instead of skipping.
name: rails-app

on:
  pull_request:
    paths:
      - "rails/**"
      - "docker-compose.yml"
      - ".github/workflows/rails-app.yml"
  push:
    branches: [main]
    paths:
      - "rails/**"
      - "docker-compose.yml"
      - ".github/workflows/rails-app.yml"

permissions:
  contents: read

concurrency:
  group: rails-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Rails tests, Zeitwerk and a production boot
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: rails
    steps:
      - uses: actions/checkout@v7

      # Reads rails/.ruby-version and caches the bundle from rails/Gemfile.lock.
      - uses: ruby/setup-ruby@v1
        with:
          working-directory: rails
          bundler-cache: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: PyYAML for the image engine
        run: python -m pip install pyyaml

      - name: Integration tests
        run: bin/rails test

      - name: Zeitwerk eager-load check
        run: bin/rails zeitwerk:check

      # The dummy secret is Rails' own "booting only to check" idiom; it is
      # never a real deployment secret.
      - name: Production boot answers /up and /admin
        env:
          RAILS_ENV: production
          SECRET_KEY_BASE_DUMMY: "1"
        run: |
          bin/rails assets:precompile
          bin/rails db:prepare
          bin/rails server -b 127.0.0.1 -p 3000 -d
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:3000/up >/dev/null; then break; fi
            if [ "$attempt" = 30 ]; then echo "::error::the app did not answer /up"; exit 1; fi
            sleep 2
          done
          curl -fsS -o /dev/null -w "/admin/sites %{http_code}\n" http://localhost:3000/admin/sites
          kill "$(cat tmp/pids/server.pid)"
