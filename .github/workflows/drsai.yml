# sites/drsai — the story engine's tests and lint, the ABC-book drift check,
# and a site build against the zer0-mistakes theme's `main`, checked out beside
# the site and named by the ZER0_THEME_LOCAL path gem the site already supports
# (ADR 0005: the theme is developed in bamr87/zer0-mistakes, so a theme change
# that breaks drsai is caught here, on drsai's side). Ported from
# bamr87/drsai's ci.yml without its tag-triggered PyPI publish; the Pages
# deploy stays in the original repository for now (see docs/MONOREPO.md).
name: drsai

on:
  push:
    branches: [main]
    paths: ["sites/drsai/**", ".github/workflows/drsai.yml"]
  pull_request:
    paths: ["sites/drsai/**", ".github/workflows/drsai.yml"]
  schedule:
    # Weekly, so a theme release that breaks the site is noticed without a drsai change.
    - cron: "37 11 * * 1"

permissions:
  contents: read

concurrency:
  group: drsai-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Story engine (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    defaults:
      run:
        working-directory: sites/drsai/drsai
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: sites/drsai/drsai/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: python -c "import nltk; nltk.download('cmudict', quiet=True)"
      - run: ruff check src/
      - run: black --check src/ tests/
      - run: pytest tests/ -q

  content:
    name: ABC books match their spec
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sites/drsai
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python3 -m pip install pyyaml
      - run: python3 tools/import_abc_book.py --check
      - run: python3 ../../tools/unwrap-prose.py --check .

  site:
    name: Jekyll build against bamr87/zer0-mistakes main
    runs-on: ubuntu-latest
    env:
      # Relative to sites/drsai, where the Gemfile reads it.
      ZER0_THEME_LOCAL: ../../.theme/zer0-mistakes
    defaults:
      run:
        working-directory: sites/drsai
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: bamr87/zer0-mistakes
          ref: main
          path: .theme/zer0-mistakes
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - run: bundle install
      - run: bundle exec jekyll build --config _config.yml,_config_dev.yml
