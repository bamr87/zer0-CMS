# sites/drsai — the story engine's tests and lint, the ABC-book drift check,
# and a site build through the Jekyll-theme option: its `build` task
# (tools/jekyll_theme.py) renders it with the zer0 theme at the tag its
# `render:` setting pins and builds it with GitHub Pages' own builder in Docker,
# so no Ruby is installed (PLAN P2). The theme is pinned, so a theme release
# cannot break the site unnoticed and there is no weekly run; the workflow runs
# when anything that builds the site changes — the site, its `render:` setting
# (workspace.yml), the workspace tool that reads it, the option and its server
# (pages.yml compares the build with its recording). Ported from
# bamr87/drsai's ci.yml without its tag-triggered PyPI publish; the Pages
# deploy stays in the original repository for now (see docs/MONOREPO.md).
name: drsai

on:
  push:
    branches: [main]
    paths: ["sites/drsai/**", "workspace.yml", "bin/zer0", "tools/workspace/**", "tools/jekyll_theme.py", "tools/jekyll/**", "tools/obsidian/**", ".github/workflows/drsai.yml"]
  pull_request:
    paths: ["sites/drsai/**", "workspace.yml", "bin/zer0", "tools/workspace/**", "tools/jekyll_theme.py", "tools/jekyll/**", "tools/obsidian/**", ".github/workflows/drsai.yml"]

permissions:
  contents: read

concurrency:
  group: drsai-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Story engine (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    defaults:
      run:
        working-directory: sites/drsai/drsai
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: sites/drsai/drsai/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: python -c "import nltk; nltk.download('cmudict', quiet=True)"
      - run: ruff check src/
      - run: black --check src/ tests/
      - run: pytest tests/ -q

  content:
    name: ABC books match their spec
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sites/drsai
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python3 -m pip install pyyaml
      - run: python3 tools/import_abc_book.py --check
      - run: python3 ../../tools/unwrap-prose.py --check .

  site:
    name: Jekyll build (the Jekyll-theme option)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --quiet pyyaml
      - name: Build with the Jekyll-theme option
        env:
          ZER0_PAGES_DEST: ${{ runner.temp }}/site
          PAGES_REPO_NWO: ${{ github.repository }}
        run: |
          bin/zer0 run build drsai
          test -f "$ZER0_PAGES_DEST/index.html" || { echo "::error::drsai built no index.html"; exit 1; }
