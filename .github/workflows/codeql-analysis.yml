# CodeQL over both halves of the repository.
#
# `javascript-typescript` covers the VS Code extension (`src/`, `esbuild.js`,
# `test-runner.js`); `ruby` covers the ABC content engine under `rails/`. Both
# run with `build-mode: none`, the supported mode for interpreted languages —
# CodeQL extracts straight from source and there is nothing to compile. The
# `autobuild` step this file used to carry only ever did anything for C/C++, C#
# and Java, so it did nothing for either language here.
name: "CodeQL"

on:
  push:
    branches: [main]
  pull_request:
    # The branches below must be a subset of the branches above.
    branches: [main]
  schedule:
    - cron: "24 14 * * 5"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: ruby
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Initializes the CodeQL tools for scanning.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # To add custom queries, list them here or point at a config file.
          # Prefix the list with "+" to run them alongside the default suite
          # rather than instead of it.
          # queries: ./path/to/local/query, your-org/your-repo/queries@main

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
