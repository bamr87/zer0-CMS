# pages — the one GitHub Pages deploy for every site in this repository (ADR 0002 §4 as
# amended by ADR 0005, PLAN C4).
#
# A repository has one Pages site, so every in-repo site is built separately and stitched
# into one artifact at its route, each under its own sub-path (/zer0-pages/, /drsai/,
# /demos/cookbook/, …). The routes live in workspace.yml (`route:`) and `bin/zer0 check`
# holds them honest; `bin/zer0 routes --json` is this workflow's plan. Each site keeps its
# own build: its `pages` task, run with a generated config file that sets only `url` and
# `baseurl` for its route. A site on the Jekyll-theme option (its `render:` setting, PLAN P2)
# is built by tools/jekyll_theme.py — the zer0 theme at the tag the setting pins, built by a
# Jekyll server in Docker (GitHub Pages' own builder, or the jekyll-4 image of
# tools/jekyll/Dockerfile) — and installs no Ruby. Every routed site is on the option since
# zer0-pages moved (PLAN P-D7), so no leg installs Ruby. The workflow runs when any of that
# changes: a site, the setting (workspace.yml), the workspace tool that reads it, the option
# and its server, or a recording.
#
# Pull requests build and verify everything and deploy nothing. A push to main deploys
# only while vars.PAGES_DEPLOY_ENABLED is 'true' (default OFF). The default target is this
# repository's project site, https://bamr87.github.io/zer0-CMS; vars.PAGES_URL and
# PAGES_BASE_PATH aim it elsewhere (a custom domain sets PAGES_BASE_PATH to '').
#
# Every build is also compared with the recording of that site's Jekyll build (PLAN P1,
# web/site/fixtures/README.md): `tools/site_manifest.py` records what it wrote — paths, each
# page's title and text, feed entries, sitemap URLs, redirects, the gems and theme commit it
# resolved — and the fresh recording is uploaded as the site-manifest-<site> artifact, to
# commit when the change is intended. A site on the Jekyll-theme option reproduces its
# recording exactly (P2), so on a pull request a difference fails its leg until the same
# pull request re-records it. A push to main only warns, so a difference never stands
# between a site and its deploy; a dispatch with `check` fails on any difference.
name: pages

on:
  push:
    branches: [main]
    paths: ["sites/**", "apps/parodynews/src/pages/**", "workspace.yml", "bin/zer0", "tools/workspace/**", "tools/site_manifest.py", "tools/jekyll_theme.py", "tools/jekyll/**", "tools/obsidian/**", "web/site/fixtures/**", ".github/workflows/pages.yml"]
  pull_request:
    paths: ["sites/**", "apps/parodynews/src/pages/**", "workspace.yml", "bin/zer0", "tools/workspace/**", "tools/site_manifest.py", "tools/jekyll_theme.py", "tools/jekyll/**", "tools/obsidian/**", "web/site/fixtures/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
    inputs:
      check:
        description: Fail when a site's build differs from its recording in web/site/fixtures/
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PAGES_URL: ${{ vars.PAGES_URL || 'https://bamr87.github.io' }}
  PAGES_BASE_PATH: ${{ vars.PAGES_BASE_PATH || '/zer0-CMS' }}
  # The theme's SCSS has multibyte characters; a non-UTF-8 locale breaks the Sass converter.
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  # Jekyll dates a post — and so its URL — in the process's time zone; the runners' zone, and
  # the one every recording in web/site/fixtures/ was made in.
  TZ: UTC

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      routes: ${{ steps.routes.outputs.routes }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --quiet pyyaml
      - id: routes
        run: |
          routes=$(bin/zer0 routes --json)
          echo "routes=$routes" >> "$GITHUB_OUTPUT"
          bin/zer0 routes >> "$GITHUB_STEP_SUMMARY"

  build:
    name: build ${{ matrix.site.route }} (${{ matrix.site.name }})
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        site: ${{ fromJSON(needs.plan.outputs.routes) }}
    env:
      # jekyll-github-metadata aborts without a repository it can infer; a project's own
      # `pages` task may name a different one.
      PAGES_REPO_NWO: ${{ github.repository }}
      # 'true' where a difference from the recording fails this leg: a site on the Jekyll-theme
      # option in a pull request, or any site when a dispatch asks for `check`.
      PARITY_GATE: ${{ inputs.check || (matrix.site.render && github.event_name == 'pull_request') }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # bin/zer0 runs the site's `pages` task (Python). On the Jekyll-theme option the task is
      # tools/jekyll_theme.py, whose Jekyll server runs in Docker; the jekyll-4 server's image is
      # built here from tools/jekyll/Dockerfile under the tag the option looks for, and cached.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --quiet pyyaml
      - name: The jekyll-4 server's image tag
        id: image
        if: matrix.site.render.server == 'jekyll-4'
        run: echo "tag=$(python tools/jekyll_theme.py image jekyll-4)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
        if: matrix.site.render.server == 'jekyll-4'
      - uses: docker/build-push-action@v7
        if: matrix.site.render.server == 'jekyll-4'
        with:
          context: tools/jekyll
          load: true
          tags: ${{ steps.image.outputs.tag }}
          cache-from: type=gha,scope=jekyll-4
          cache-to: type=gha,scope=jekyll-4,mode=max
      - name: Build at ${{ matrix.site.route }}
        env:
          NAME: ${{ matrix.site.name }}
          ROUTE: ${{ matrix.site.route }}
        run: |
          set -euo pipefail
          # "/" → the base path itself; "/drsai/" → <base>/drsai
          baseurl="${PAGES_BASE_PATH%/}${ROUTE%/}"
          printf 'url: "%s"\nbaseurl: "%s"\n' "$PAGES_URL" "$baseurl" > "$RUNNER_TEMP/route.yml"
          export ZER0_PAGES_CONFIG="$RUNNER_TEMP/route.yml" ZER0_PAGES_DEST="$RUNNER_TEMP/out" ZER0_PAGES_BASEURL="$baseurl"
          # The option writes what its build resolved (the theme's commit, the server) here.
          export ZER0_PAGES_BUILT_WITH="$RUNNER_TEMP/built-with.json"
          bin/zer0 run pages "$NAME" 2>&1 | tee "$RUNNER_TEMP/build.log"
          test -f "$RUNNER_TEMP/out/index.html" || { echo "::error::$NAME built no index.html"; exit 1; }
      # Jekyll 3 reports a broken Liquid expression as a warning, drops it from the page and
      # exits 0, so every site is warned here rather than silently published with a hole.
      - name: Liquid warnings
        env:
          NAME: ${{ matrix.site.name }}
        run: |
          if grep -nE 'Liquid (Warning|Exception)' "$RUNNER_TEMP/build.log"; then
            echo "::warning::$NAME has Liquid warnings (above): content was dropped from those pages"
          fi
      # PLAN P1: what this build wrote, against the recording of the site's Jekyll build. It
      # never stands between a site and its deploy — on a push the two steps continue on an
      # error — and the interpreter is the one the recordings were written with, so a parser
      # change in another Python release cannot pass for a change to a site.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Record what the build wrote
        id: record
        continue-on-error: ${{ env.PARITY_GATE != 'true' }}
        env:
          NAME: ${{ matrix.site.name }}
          SOURCE: ${{ matrix.site.bundle_dir }}
        run: |
          set -euo pipefail
          # What the build resolved: the option's report, or a Gemfile site's bundle.
          if [ -f "$RUNNER_TEMP/built-with.json" ]; then
            python3 tools/site_manifest.py build "$RUNNER_TEMP/out" --site "$NAME" --built-with "$RUNNER_TEMP/built-with.json" --out "$RUNNER_TEMP/manifests/$NAME/manifest.json"
          else
            python3 tools/site_manifest.py build "$RUNNER_TEMP/out" --site "$NAME" --source "$SOURCE" --out "$RUNNER_TEMP/manifests/$NAME/manifest.json"
          fi
      - uses: actions/upload-artifact@v7
        if: steps.record.outcome == 'success'
        with:
          name: site-manifest-${{ matrix.site.name }}
          path: ${{ runner.temp }}/manifests
          retention-days: 30
      - name: Compare with the recorded build
        if: steps.record.outcome == 'success'
        continue-on-error: ${{ env.PARITY_GATE != 'true' }}
        env:
          NAME: ${{ matrix.site.name }}
        run: |
          set -euo pipefail
          status=0
          python3 tools/site_manifest.py compare "web/site/fixtures/$NAME/manifest.json" "$RUNNER_TEMP/manifests/$NAME/manifest.json" | tee "$RUNNER_TEMP/compare.txt" || status=$?
          if [ "$status" -ne 0 ]; then
            { echo "### $NAME differs from its recording"; echo '```'; head -n 200 "$RUNNER_TEMP/compare.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            level=$([ "$PARITY_GATE" = "true" ] && echo error || echo warning)
            echo "::$level::$NAME's build differs from web/site/fixtures/$NAME/manifest.json (the job summary says how); if that is intended, commit the site-manifest-$NAME artifact over web/site/fixtures/ in this pull request"
            test "$PARITY_GATE" != "true"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: pages-${{ matrix.site.name }}
          path: ${{ runner.temp }}/out
          retention-days: 3
          include-hidden-files: true

  assemble:
    needs: [plan, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: pages-*
          path: ${{ runner.temp }}/parts
      - name: Stitch every site in at its route
        env:
          ROUTES: ${{ needs.plan.outputs.routes }}
          PARTS: ${{ runner.temp }}/parts
        run: |
          set -euo pipefail
          mkdir -p _site
          # Root first (the plan sorts it first), so a sub-path site lands on top of it.
          echo "$ROUTES" | jq -r '.[] | "\(.name) \(.route)"' | while read -r name route; do
            dest="_site${route}"
            mkdir -p "$dest"
            cp -a "$PARTS/pages-$name/." "$dest"
            test -f "$dest/index.html" || { echo "::error::$route ($name) has no index.html"; exit 1; }
            echo "ok: $route ← $name"
          done
          touch _site/.nojekyll
          # A custom domain is set in the repository's Pages settings for an Actions deploy;
          # a stray CNAME from one site's tree would only mislead.
          rm -f _site/CNAME
          du -sh _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: assemble
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PAGES_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
