# The workspace gate: the tooling behind bin/zer0 passes its own tests, and
# `bin/zer0 check` passes against the real tree — every directory under
# packages/, sites/ and apps/ is registered in workspace.yml, every project's
# workflow exists and filters on its path, and every vendored copy is still
# byte-identical to its source. It runs on every pull request (it takes
# seconds and needs nothing but Python and PyYAML), because drift can come
# from any tree. The full history is fetched because the tool's golden tests
# replay its Ruby predecessor's recordings on a commit of that history.
#
# It also runs the ADR 0006 absorption gate (tools/check_absorption.py) and
# prints its burn-down. It also prints, to the job summary, the projects a pull request affects (so
# a reviewer can see which projects' gates should have run) and the CMS's own
# `zer0 doctor` over every zer0 site in the repository — report-only, like the
# reusable zer0-doctor.yml it mirrors, because two sites carry known errors
# (docs/MONOREPO.md). That doctor is still Ruby (rails/bin/zer0-cms) until
# PLAN G4 ports it, so Ruby is installed for that last step and nothing else.
name: zer0-workspace

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: zer0-workspace-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: bin/zer0 check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --quiet pyyaml
      - name: Workspace tool tests
        run: python -m unittest discover tools/workspace
      - name: bin/zer0 check
        run: bin/zer0 check
      # ADR 0006: the Ruby ratchet and the capability ledger
      # (docs/plan/capabilities.yml) — no new Ruby, no source deleted before its
      # capabilities moved, no capability marked done without its proof.
      - name: Absorption gate (ADR 0006)
        run: |
          python -m unittest discover tools/tests
          python tools/check_absorption.py --report | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Projects this change affects
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          {
            echo "### Projects this pull request affects"
            echo
            bin/zer0 affected --base "origin/$BASE_REF" | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"
      # Temporary, until PLAN G4 ports zer0 doctor to the platform: the doctor
      # `bin/zer0 doctor` runs is rails/bin/zer0-cms, stdlib Ruby. Remove with G4.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: zer0 doctor over every site (report-only)
        run: |
          {
            echo "### zer0 doctor"
            echo
            echo '```'
            bin/zer0 doctor
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
