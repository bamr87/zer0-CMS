# zer0 doctor — the zer0 stack consumer contract check, as a reusable workflow.
#
# A content repository calls it (RFC §4):
#
#   jobs:
#     doctor:
#       uses: bamr87/zer0-CMS/.github/workflows/zer0-doctor.yml@main
#       with:
#         site-path: "."          # the Jekyll root inside the caller repo
#         fail-on-error: false    # report-only by default
#
# It checks out the CALLER repository and bamr87/zer0-CMS (main) side by side,
# runs the platform's doctor, `python -m sites.doctor <site> --format findings`
# from zer0-CMS's content/ (PyYAML and jsonschema, no Django, no Ruby — PLAN
# G4 ported it from rails/bin/zer0-cms), writes the findings as a job summary
# table and a `zer0-doctor-findings` artifact, and fails only when
# `fail-on-error` is true and the doctor reported an error. A bad `site-path`
# (missing, absolute, or climbing out of the checkout) always fails.
#
# workflow_dispatch runs it against this repository, which is not a Jekyll
# site: useful only to see the report shape.
name: zer0-doctor

on:
  workflow_call:
    inputs:
      site-path:
        description: "Path to the Jekyll site root, relative to the caller repository root"
        type: string
        required: false
        default: "."
      fail-on-error:
        description: "Fail the job when the doctor reports an error"
        type: boolean
        required: false
        default: false
  workflow_dispatch:
    inputs:
      site-path:
        description: "Path to the Jekyll site root, relative to the repository root"
        type: string
        required: false
        default: "."
      fail-on-error:
        description: "Fail the job when the doctor reports an error"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: zer0-doctor-${{ github.repository }}-${{ github.ref }}-${{ inputs.site-path }}
  cancel-in-progress: true

jobs:
  doctor:
    name: zer0 doctor (${{ inputs.site-path }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # In a called workflow `github.repository` is the caller, so this is the
      # content repository.
      - name: Check out the site
        uses: actions/checkout@v7
        with:
          path: site
          persist-credentials: false

      - name: Check out zer0-CMS
        uses: actions/checkout@v7
        with:
          repository: bamr87/zer0-CMS
          ref: main
          path: zer0-cms
          persist-credentials: false

      # The platform's doctor (content/sites/doctor.py) needs no Django: PyYAML and
      # jsonschema on the Python the platform runs on.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --quiet pyyaml jsonschema

      - name: Run the doctor
        id: doctor
        env:
          SITE_PATH: ${{ inputs.site-path }}
        run: |
          case "$SITE_PATH" in
            /* | .. | ../* | */.. | */../*)
              echo "::error::site-path must be relative to the repository root and stay inside it: $SITE_PATH"
              exit 2 ;;
          esac
          if [ ! -d "site/$SITE_PATH" ]; then
            echo "::error::site-path is not a directory in the repository: $SITE_PATH"
            exit 2
          fi
          mkdir -p doctor-report
          set +e
          (cd zer0-cms/content && python -m sites.doctor "$GITHUB_WORKSPACE/site/$SITE_PATH" --format findings) > doctor-report/findings.jsonl
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -gt 1 ]; then
            echo "::error::the doctor could not run (exit $status)"
            exit "$status"
          fi

      - name: Write the job summary
        if: always() && steps.doctor.outputs.status != ''
        env:
          SITE_PATH: ${{ inputs.site-path }}
        shell: python
        run: |
          import json, os, re
          findings = [json.loads(line) for line in open("doctor-report/findings.jsonl") if line.strip()]
          cell = lambda text: re.sub(r"\s+", " ", str(text or "").replace("|", "\\|"))[:200]
          errors = [f for f in findings if f["severity"] == "error"]
          warnings = [f for f in findings if f["severity"] == "warning"]
          out = f"## zer0 doctor: `{cell(os.environ['SITE_PATH'])}`\n\n"
          out += f"**{len(errors)} error(s), {len(warnings)} warning(s).** Full findings: the `zer0-doctor-findings` artifact.\n\n"
          listed = errors + [f for f in warnings if f["check_id"] != "content"]
          if listed:
              out += "| Severity | Check | Rule | File | Evidence |\n|---|---|---|---|---|\n"
              for f in listed[:200]:
                  where = f"{f['file']}:{f['line']}" if f["line"] else f["file"]
                  out += f"| {f['severity']} | {cell(f['check_id'])} | {cell(f['rule'])} | {cell(where)} | {cell(f['evidence'])} |\n"
              if len(listed) > 200:
                  out += f"\n_{len(listed) - 200} more rows in the artifact._\n"
          content = {}
          for f in warnings:
              if f["check_id"] == "content":
                  content[f["rule"]] = content.get(f["rule"], 0) + 1
          if content:
              out += "\n### Content warnings by rule (report-only)\n\n| Rule | Files |\n|---|---|\n"
              for rule, count in sorted(content.items(), key=lambda item: (-item[1], item[0])):
                  out += f"| {cell(rule)} | {count} |\n"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(out)

      - name: Upload the findings
        if: always() && steps.doctor.outputs.status != ''
        uses: actions/upload-artifact@v7
        with:
          name: zer0-doctor-findings
          path: doctor-report/findings.jsonl
          if-no-files-found: error

      - name: Fail on errors when asked
        if: inputs.fail-on-error && steps.doctor.outputs.status == '1'
        run: |
          echo "::error::the zer0 doctor reported errors (fail-on-error is true)"
          exit 1
