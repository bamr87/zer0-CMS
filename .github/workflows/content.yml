# content/ — the content plane (Django + Wagtail): tests, migrations, lint,
# the committed schemas and the agents' eval suites. Filtered to the plane's
# own tree and the shared schemas it owns, and run inside content/.
#
# Two jobs, because the plane runs on both databases: `sqlite` is the full
# suite (including the round trips of the large in-repo sites, which read
# sites/ and packages/ from the checkout) plus every drift check; `postgres`
# runs the fast tier against pgvector, where the vector column, `<=>` kNN and
# `SKIP LOCKED` are real. No job reaches a model provider: the LLM backend is
# the recorded one (content/agents/recordings/).
#
# The sqlite job is a two-interpreter matrix, and what each leg runs differs on
# purpose (see `PRIMARY_PYTHON` below): the version-independent checks run once,
# and on a pull request the secondary interpreter skips the `slow` tier. A push
# to main always runs everything on both.
name: content

on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "schemas/events/**"
      - "schemas/graphql/**"
      - "schemas/content/**"
      - "schemas/openapi/**"
      - ".github/workflows/content.yml"
  pull_request:
    paths:
      - "content/**"
      - "schemas/events/**"
      - "schemas/graphql/**"
      - "schemas/content/**"
      - "schemas/openapi/**"
      - ".github/workflows/content.yml"

permissions:
  contents: read

concurrency:
  group: content-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: content

jobs:
  sqlite:
    name: suite, migrations, schemas, evals (Python ${{ matrix.python }}, SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    env:
      DJANGO_SETTINGS_MODULE: config.settings.testing
      # The leg that carries the version-INDEPENDENT work. ruff (pinned
      # `target-version = "py312"` in content/pyproject.toml), the
      # makemigrations check, the three committed-schema diffs and the recorded
      # eval suites all reach the same verdict on either interpreter, so running
      # them on both bought nothing but minutes. The suite itself still runs on
      # both — that is what the matrix is for.
      PRIMARY_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: content/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        if: matrix.python == env.PRIMARY_PYTHON
        run: ruff check . && ruff format --check .
      - name: Migrations are complete
        if: matrix.python == env.PRIMARY_PYTHON
        run: python manage.py makemigrations --check --dry-run
      # The theme's docs site is the largest round-trip fixture (376 files). It lives in
      # its own repository (ADR 0005), so the suite reads it from a pinned checkout under
      # ZER0_THEME_CHECKOUT and skips that one case when the directory is absent.
      # Only the `slow` tier reads this fixture, so it is checked out only on
      # the legs that run that tier.
      - uses: actions/checkout@v7
        if: matrix.python == env.PRIMARY_PYTHON || github.event_name != 'pull_request'
        with:
          repository: bamr87/zer0-mistakes
          ref: v1.31.3
          path: .cache/zer0-mistakes
          persist-credentials: false
      - name: Tests (full suite)
        if: matrix.python == env.PRIMARY_PYTHON || github.event_name != 'pull_request'
        run: python -m pytest -q
      # On a pull request the secondary interpreter runs everything except the
      # `slow` tier — the round trips of the large in-repo sites, which compare
      # a site export with its recording and so cannot differ between 3.12 and
      # 3.13. The push to main that follows the merge runs the full suite on
      # both, so nothing reaches main unproven on either interpreter.
      - name: Tests (fast tier)
        if: matrix.python != env.PRIMARY_PYTHON && github.event_name == 'pull_request'
        run: python -m pytest -q -m "not slow"
      - name: The committed GraphQL schema is current
        if: matrix.python == env.PRIMARY_PYTHON
        run: |
          python manage.py graphql_schema --out "$RUNNER_TEMP/schema.graphql"
          diff -u ../schemas/graphql/schema.graphql "$RUNNER_TEMP/schema.graphql"
      - name: The committed agent schema is current
        if: matrix.python == env.PRIMARY_PYTHON
        run: python manage.py wagtail_ai_schema --check ../schemas/content/ai-schema.json
      - name: The committed OpenAPI document is current
        if: matrix.python == env.PRIMARY_PYTHON
        run: |
          python manage.py spectacular --format openapi-json --urlconf ops.openapi --fail-on-warn --file "$RUNNER_TEMP/openapi.json"
          diff -u ../schemas/openapi/openapi.json "$RUNNER_TEMP/openapi.json"
      - name: Eval suites (recorded models)
        if: matrix.python == env.PRIMARY_PYTHON
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development
          DATABASE_URL: sqlite:///${{ runner.temp }}/evals.sqlite3
        run: |
          python manage.py migrate -v0
          python manage.py sync_agents
          python manage.py run_evals --all --recorded

  postgres:
    name: fast tier on Postgres 16 + pgvector
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: zer0
          POSTGRES_PASSWORD: zer0
          POSTGRES_DB: zer0
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U zer0" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.testing
      DATABASE_URL: postgres://zer0:zer0@localhost:5432/zer0
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: content/requirements*.txt
      - run: pip install -r requirements-dev.txt
      # No makemigrations check here: the sqlite leg above already runs it, and
      # it reads the migration graph, not the database.
      - run: python -m pytest -q -m "not slow"
