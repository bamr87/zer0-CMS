# The VS Code extension half of this repository, gated on its own terms.
#
# `extension` type-checks, lints, bundles and then runs the suite against a real
# VS Code — which is why every test step is wrapped in `xvfb-run`. `vscode-test`
# downloads and launches the editor, and on a headless runner that dies with
# "Missing X server or $DISPLAY" followed by a SIGSEGV. It is the single most
# commonly missed piece of a VS Code extension pipeline.
#
# The ABC generator's Ruby tests used to live here as a second job. They moved
# to `abc-engine.yml` so a TypeScript pull request no longer boots a Ruby
# toolchain it does not use — hence the `paths-ignore` below. `main` is not
# branch-protected, so a skipped run here is not a required check left pending.
name: extension

on:
  pull_request:
    paths-ignore:
      - "rails/**"
  push:
    branches: [main]
    paths-ignore:
      - "rails/**"

permissions:
  contents: read

concurrency:
  group: extension-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extension:
    name: Build, lint and test the VS Code extension
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # 22, not 20: the extension host runs Node 22.15, `.nvmrc` says 22, and
      # the bundled engines package declares `engines.node >= 22` — its
      # CJS-bundled static import needs `require(esm)`, which is Node >= 22.12.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run check-types

      - name: Lint
        run: npm run lint

      - name: Bundle
        run: npm run compile

      # Real VS Code, real extension host, no display on the runner.
      - name: Test
        run: xvfb-run -a npm test

      # Every documented `zer0Cms.*` setting must exist in the manifest, and
      # every contributed setting must be documented. Stdlib Python, no install.
      - name: Check the settings documentation
        run: python3 tools/check-config-docs.py

      # `--no-dependencies` is honest here rather than a shortcut: the extension
      # ships zero runtime dependencies and everything else is bundled by
      # esbuild, so there is no node_modules tree to fold into the vsix.
      - name: Package
        run: npx @vscode/vsce package --no-dependencies

      # What ends up inside the vsix is a reviewed artefact, not a side effect
      # of whatever `.vscodeignore` happens to say today. A packaging change is
      # a diff a person reads; regenerate with:
      #   npx @vscode/vsce ls --no-dependencies | LC_ALL=C sort > .vsix-manifest.txt
      - name: Verify the packaged file list
        run: |
          npx @vscode/vsce ls --no-dependencies | LC_ALL=C sort > /tmp/vsix-actual.txt
          diff -u .vsix-manifest.txt /tmp/vsix-actual.txt

      # The version string no longer identifies a build — release-please owns it
      # and it only moves on a release — so the artifact is named by commit.
      - uses: actions/upload-artifact@v7
        with:
          name: zer0-cms-${{ github.sha }}
          path: "*.vsix"
          if-no-files-found: error
