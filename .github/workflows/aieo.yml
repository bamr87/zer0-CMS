# apps/aieo — the AI Engine Optimization app's pull-request gate, ported from
# its own ci.yml: the FastAPI backend's pytest suite against PostgreSQL and
# Redis, the React frontend's lint/smoke test/build, and the backend lint
# (black, ruff, and mypy as advisory). Every job runs inside apps/aieo. Not
# ported (see docs/MONOREPO.md): the Codecov upload, the tag-triggered
# frontend release (release.yml), the reusable content-scoring workflow and its
# it-journey pilot, and the Dependabot config — all still under
# apps/aieo/.github/ as reference.
name: aieo

on:
  push:
    branches: [main]
    paths: ["apps/aieo/**", ".github/workflows/aieo.yml"]
  pull_request:
    paths: ["apps/aieo/**", ".github/workflows/aieo.yml"]

permissions:
  contents: read

concurrency:
  group: aieo-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/aieo

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: aieo
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: aieo_test
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
        ports: ["5432:5432"]
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/aieo/backend/requirements.txt
      - name: Install dependencies
        working-directory: apps/aieo/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov
      - name: Run tests
        working-directory: apps/aieo/backend
        env:
          DATABASE_URL: postgresql://aieo:testpass@localhost:5432/aieo_test
          REDIS_URL: redis://localhost:6379/0
        run: pytest --cov=app

  frontend-tests:
    name: Frontend lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/aieo/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/aieo/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --coverage --watchAll=false
      - run: npm run build

  lint:
    name: Backend lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install linting tools
        # ruff floats per the fleet ALWAYS-LATEST policy; its rule set is
        # pinned in ruff.toml instead of by version. black stays pinned as it
        # was in the original repository.
        run: pip install black==26.10.0 ruff mypy
      - run: black --check backend/
      - run: ruff check backend/
      - name: Type check (advisory)
        run: mypy backend/app --ignore-missing-imports || echo "Type checking completed with warnings"
