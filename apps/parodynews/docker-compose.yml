# Docker Compose Configuration for ParodyNews
# Production environment configuration
# Usage:
#   Production: docker-compose up
#   Development: Use .devcontainer/docker-compose_dev.yml

services:
  # PostgreSQL Database (shared by both dev and prod)
  parodynewsdb:
    image: postgres:15-alpine
    container_name: parodynewsdb
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-parodynewsdb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d parodynewsdb"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - parodynews-network

  # Django Web Application - Production Mode
  web-prod:
    build:
      context: ./src
      dockerfile: Dockerfile
    container_name: parodynews-web-prod
    working_dir: /app
    volumes:
      - setup-data:/app/setup_data  # Persist installation wizard state
      - app-logs:/app/logs          # Persist application logs
    environment:
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_NAME: ${DB_NAME:-parodynewsdb}
      DB_HOST: ${DB_HOST:-parodynewsdb}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DJANGO_SETTINGS_MODULE: config.settings.production
      DEBUG: "False"
      # Production settings refuse to start without these; the image has no .env.
      SECRET_KEY: ${SECRET_KEY:-}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
      PYTHONPATH: /app
      PYTHONUNBUFFERED: 1
      # AI provider configuration. Credentials saved in the Settings screen
      # take precedence over these.
      AI_DEFAULT_PROVIDER: ${AI_DEFAULT_PROVIDER:-claude_code}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Installation wizard configuration
      SKIP_INSTALLATION_CHECK: ${SKIP_INSTALLATION_CHECK:-false}
      SETUP_TOKEN_EXPIRY_HOURS: ${SETUP_TOKEN_EXPIRY_HOURS:-1}
      SETUP_DATA_DIR: /app/setup_data
      # Django admin credentials (set these in production!)
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-admin}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-admin@localhost.local}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-admin}
      ADMIN_CREDENTIALS_FILE: ${ADMIN_CREDENTIALS_FILE:-/app/setup_data/admin_credentials.txt}
    ports:
      - "${DJANGO_PROD_PORT:-80}:8000"
    networks:
      - parodynews-network
    restart: unless-stopped

  # Jekyll Static Site Generator (optional service)
  jekyll:
    image: jekyll/jekyll:latest
    container_name: parodynews-jekyll
    profiles: ["jekyll", "dev"]
    command: jekyll serve --watch --force_polling
    volumes:
      - ./src/pages:/app/pages
    ports:
      - "${JEKYLL_PORT:-4002}:4002"
    working_dir: /app/pages
    environment:
      JEKYLL_ENV: ${JEKYLL_ENV:-development}
    networks:
      - parodynews-network

  # Sphinx Documentation Server
  docs:
    build:
      context: ./src
      dockerfile: parodynews/docs/Dockerfile
    container_name: parodynews-docs
    ports:
      - "${DOCS_PORT:-8080}:80"
    networks:
      - parodynews-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  postgres-data:
    name: parodynews-postgres-data
  setup-data:
    name: parodynews-setup-data
  app-logs:
    name: parodynews-logs

networks:
  parodynews-network:
    name: parodynews-network
    driver: bridge
